/* ---------- 소리 ---------- */
let actx = null, muted = false;
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function tone(f, dur, type = 'square', vol = 0.07, to = null, delay = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
}
const SFX = {

/* ---------- 지도와 물리 ---------- */
function solidTop(c, r) {
  if (r <= 0) return false;
  if (r >= ROWS) return true;
  if (c < 0 || c >= COLS) return true;
  const ch = grid[r][c];
  return ch === '#' || ch === '=';
}
// 몸(x,y,w,h,vx,vy) 움직이기: 양옆 벽은 막히고, 발판은 위에서 내려올 때만 밟힘
function moveBody(b, dt) {
  b.x += b.vx * dt;
  let hit = 0;
  if (b.x < T) { b.x = T; hit = -1; } else if (b.x > W - T - b.w) { b.x = W - T - b.w; hit = 1; }
  const prevB = b.y + b.h;
  b.vy = Math.min(MAXFALL, b.vy + GRAV * dt);
  b.y += b.vy * dt;
  b.onGround = false;
  if (b.vy >= 0) {
    const nb = b.y + b.h;
    const r0 = Math.floor(prevB / T), r1 = Math.floor(nb / T);
    outer: for (let r = r0; r <= r1; r++) {
      const top = r * T;
      if (prevB <= top + 0.5 && nb >= top) {
        const c0 = Math.floor((b.x + 3) / T), c1 = Math.floor((b.x + b.w - 3) / T);
        for (let c = c0; c <= c1; c++) {
          if (solidTop(c, r)) { b.y = top - b.h; b.vy = 0; b.onGround = true; break outer; }
        }
      }
    }
  }
  if (b.y < T) { b.y = T; if (b.vy < 0) b.vy = 0; }
  return hit;
}
function overlap(a, b, shrink = 0) {
  return a.x + shrink < b.x + b.w - shrink && a.x + a.w - shrink > b.x + shrink &&
         a.y + shrink < b.y + b.h - shrink && a.y + a.h - shrink > b.y + shrink;
}
function circRect(c, r) {
  const nx = Math.max(r.x, Math.min(c.x, r.x + r.w));
  const ny = Math.max(r.y, Math.min(c.y, r.y + r.h));
  return (c.x - nx) ** 2 + (c.y - ny) ** 2 < c.r * c.r;
}

/* ---------- 스테이지 ---------- */
function makeEnemy(ch, c, r) {
  if (ch === 'B') {
    return { type: 'boss', x: c * T, y: r * T, w: 84, h: 84, dx: 1, dy: 0.6, hp: BOSS_HP, maxHp: BOSS_HP,
      state: 'alive', angry: 0, t: 0, fireT: 2.5, hurtT: 0, facing: 1, vx: 0, vy: 0 };
  }
  if (ch === 'R') {
    const w = 26, h = 28;
    return { type: 'robot', x: c * T + (T - w) / 2, y: (r + 1) * T - h, w, h, vx: 0, vy: 0, onGround: false,
      facing: Math.random() < 0.5 ? -1 : 1, state: 'alive', angry: 0, jumpT: 1 + Math.random() * 2, edge: false, t: 0 };
  }
  const w = 28, h = 28, a = Math.random() < 0.5 ? 1 : -1, b = Math.random() < 0.5 ? 1 : -1;
  return { type: 'ghost', x: c * T + (T - w) / 2, y: r * T + (T - h) / 2, w, h, dx: a * Math.SQRT1_2, dy: b * Math.SQRT1_2,
    state: 'alive', angry: 0, t: 0, alive: 0, mult: 1, facing: a, steerT: 2 + Math.random() * 2 };
}
function resetPlayer() {
  player = { x: spawn.x, y: spawn.y, w: 22, h: 28, vx: 0, vy: 0, onGround: false, facing: 1, coyote: 0,
    shootCd: 0, invuln: 2, dying: 0, speedT: 0, bigT: 0, walkT: 0, shootAnim: 0 };
}
function loadStage(i) {
  stageIdx = i;
  grid = MAPS[i].map(r => r.split(''));
  enemies = []; bubbles = []; items = []; pops = []; parts = []; sparks = [];
  bossStage = MAPS[i].some(row => row.includes('B'));
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = grid[r][c];
    if (ch === 'R' || ch === 'G' || ch === 'B') { grid[r][c] = '.'; enemies.push(makeEnemy(ch, c, r)); }
  }
  spawn = { x: 2 * T + 5, y: 14 * T - 28 };
  resetPlayer();
  state = 'intro'; stateT = 1.8; stageTime = 0;
  stageStartScore = score;
  if (bossStage && lives < BOSS_LIVES) {
    lives = BOSS_LIVES;
    say('보스전! 목숨 ' + BOSS_LIVES + '개로 시작해요', W / 2, H / 2 + 80, '#ff8ac6');
  }
  updHud();
}
// from: 시작할 스테이지(0부터), keepScore: 그 스테이지를 시작할 때의 점수로 되돌려 이어 하기
function startGame(from = 0, keepScore = false) {
  ensureAudio();

  lives = START_LIVES; paused = false;
  loadStage(from);
  if (from > 0 || savedStage > 0) saveStage(from);
  hideOv();
}

  if (score > best) { best = score; try { localStorage.setItem(KEY, String(best)); } catch (e) {} }
}

/* ---------- 게임 진행 ---------- */

  score += n;
  if (x !== undefined) pops.push({ x, y, text: '+' + n, t: 1 });
  updHud();
}
function say(text, x, y, color = '#ffe27a') { pops.push({ x, y, text, t: 1.3, color }); }
function poof(x, y, color = '#bfefff', n = 8) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 120;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.4 + Math.random() * 0.3, color });
  }
}
function shoot() {
  if (bubbles.filter(b => !b.enemy).length >= 7) return false;
  const p = player, big = p.bigT > 0, r = big ? 22 : 16;
  let x = p.x + p.w / 2 + p.facing * (p.w / 2 + r * 0.5);
  let y = p.y + p.h * 0.45;
  x = Math.max(T + r, Math.min(W - T - r, x));
  y = Math.max(T + r, Math.min(H - T - r, y));

  ctx.fillRect(f > 0 ? 12 : 6, 11, 3, 3); ctx.fillRect(f > 0 ? 18 : 12, 11, 3, 3);
  // 등의 태엽
  ctx.save(); ctx.translate(f > 0 ? 1 : 25, 15); ctx.rotate(t * 6);
  ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.stroke();
  ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(-5, 0, 2.5, 0, 7); ctx.arc(5, 0, 2.5, 0, 7); ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawGhost(e, x, y, s = 1) {
  const w = e.w, h = e.h, f = e.facing;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (e.state === 'dead') ctx.rotate(e.deadT * 12);
  ctx.translate(-w / 2, -h / 2);
  const bob = e.state === 'alive' ? Math.sin(e.t * 5) * 1.5 : 0;
  ctx.translate(0, bob);
  ctx.globalAlpha = 0.92;
  ctx.fillStyle = ghostColor(e.mult || 1);
  ctx.beginPath();
  ctx.arc(14, 12, 12, Math.PI, 0);
  ctx.lineTo(26, 26);
  for (let i = 0; i < 4; i++) { const x0 = 26 - i * 6; ctx.quadraticCurveTo(x0 - 1.5, 21 + (i % 2) * 2, x0 - 6, 26); }
  ctx.closePath(); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(9 + f * 2, 12, 3.5, 4.5, 0, 0, 7); ctx.ellipse(19 + f * 2, 12, 3.5, 4.5, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b1640';
  ctx.beginPath(); ctx.arc(10 + f * 3, 13, 2, 0, 7); ctx.arc(20 + f * 3, 13, 2, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBoss(e, x, y, s = 1) {
  const w = e.w, h = e.h, f = e.facing, t = e.t;
  ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.scale(s, s);
  if (e.state === 'dead') ctx.rotate(e.deadT * 6);
  ctx.translate(-w / 2, -h / 2);
  const rage = e.hp <= e.maxHp / 2 || e.angry > 0;
  const body = e.hurtT > 0 ? '#ffffff' : rage ? '#ff7a7a' : '#9fc3d6', dark = rage ? '#b33a3a' : '#5d8296';
  const walk = e.state === 'alive' ? Math.sin(t * 6) * 3 : 0;
  ctx.fillStyle = dark; ctx.fillRect(16, 68 + walk, 16, 14); ctx.fillRect(52, 68 - walk, 16, 14);
  ctx.fillStyle = body; rr(6, 20, 72, 54, 14); ctx.fill();
  ctx.fillStyle = dark; rr(14, 52, 56, 14, 6); ctx.fill();
  ctx.fillStyle = '#ffd36b';
  for (const bx of [24, 42, 60]) { ctx.beginPath(); ctx.arc(bx, 59, 3, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#1b2a33'; rr(f > 0 ? 22 : 12, 28, 50, 18, 8); ctx.fill();
  ctx.fillStyle = rage ? '#ffe27a' : '#7ef7ff';
  const ex = f > 0 ? 30 : 20;
  ctx.fillRect(ex, 33, 9, 8); ctx.fillRect(ex + 22, 33, 9, 8);
  if (rage) { ctx.fillStyle = '#1b2a33'; ctx.fillRect(ex - 1, 31, 11, 3); ctx.fillRect(ex + 21, 31, 11, 3); }
  // 왕관
  ctx.fillStyle = '#ffd36b';
  ctx.beginPath(); ctx.moveTo(20, 22); ctx.lineTo(20, 4); ctx.lineTo(31, 14); ctx.lineTo(42, 0); ctx.lineTo(53, 14); ctx.lineTo(64, 4); ctx.lineTo(64, 22); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff5a8a'; ctx.beginPath(); ctx.arc(42, 14, 3.5, 0, 7); ctx.fill();
  // 등의 큰 태엽
  ctx.save(); ctx.translate(f > 0 ? 4 : 80, 46); ctx.rotate(t * 4);
  ctx.strokeStyle = '#ffd36b'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-14, 0); ctx.lineTo(14, 0); ctx.stroke();
  ctx.fillStyle = '#ffd36b';
  ctx.beginPath(); ctx.arc(-14, 0, 6, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(14, 0, 6, 0, 7); ctx.fill();
  ctx.restore();
  ctx.restore();
}
function drawEnemy(e, x = e.x, y = e.y, s = 1) {
  if (e.type === 'robot') drawRobot(e, x, y, s);
  else if (e.type === 'boss') drawBoss(e, x, y, s);
  else drawGhost(e, x, y, s);
}
// 보스의 태엽 폭탄: 까만 공 + 반짝이는 심지
function drawSparks() {
  for (const s of sparks) {
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.t * 4);
    ctx.shadowColor = '#ff7a3c'; ctx.shadowBlur = 14;
    ctx.fillStyle = '#4a3d5c'; ctx.beginPath(); ctx.arc(0, 0, s.r, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffa04d'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#ffffff66'; ctx.beginPath(); ctx.arc(-3, -3, 2.5, 0, 7); ctx.fill();
    ctx.strokeStyle = '#c9a26b'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(4, -6); ctx.quadraticCurveTo(8, -12, 11, -10); ctx.stroke();
    ctx.fillStyle = Math.floor(s.t * 16) % 2 ? '#ffe27a' : '#ff7a3c';
    star(11, -10, 4, 1.8);
    ctx.restore();
  }
}
function drawBossBar() {
  const boss = enemies.find(e => e.type === 'boss');
  if (!boss || boss.state === 'dead') return;
  ctx.fillStyle = '#120a26cc'; rr(W / 2 - 130, 4, 260, 24, 8); ctx.fill();
  ctx.fillStyle = '#3a2160'; rr(W / 2 - 126, 8, 252, 16, 6); ctx.fill();
  const k = Math.max(0, boss.hp) / boss.maxHp;
  if (k > 0) { ctx.fillStyle = '#ff5a8a'; rr(W / 2 - 126, 8, 252 * k, 16, 6); ctx.fill(); }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '14px Jua, sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(boss.state === 'trapped' ? '태엽 마왕 · 갇혔다!' : `태엽 마왕 ${Math.max(0, boss.hp)}/${boss.maxHp}`, W / 2, 17);
}
function drawBubble(b) {
  if (b.enemy) drawEnemy(b.enemy, b.x - b.enemy.w / 2, b.y - b.enemy.h / 2, b.enemy.type === 'boss' ? 0.95 : 0.72);
  const warn = b.enemy && b.life < 2.5 && Math.floor(b.life * 8) % 2 === 0;
  const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 2, b.x, b.y, b.r);
  g.addColorStop(0, warn ? '#ff8a8a33' : '#ffffff22');
  g.addColorStop(1, warn ? '#ff5a5a66' : '#7fdcff55');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
  ctx.strokeStyle = warn ? '#ff7a7a' : '#c8f4ff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#ffffffcc';
  ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.38, b.y - b.r * 0.42, b.r * 0.22, b.r * 0.13, -0.7, 0, 7); ctx.fill();
}
function banner(t1, t2) {
  ctx.fillStyle = '#120a26aa'; ctx.fillRect(0, H / 2 - 56, W, 104);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffd6f0'; ctx.font = '44px Jua, sans-serif'; ctx.fillText(t1, W / 2, H / 2 - 14);
  if (t2) { ctx.fillStyle = '#c9b8ff'; ctx.font = '22px Jua, sans-serif'; ctx.fillText(t2, W / 2, H / 2 + 28); }
}
function draw() {
  const C = COLORS[stageIdx % COLORS.length];
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.bg1); g.addColorStop(1, C.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) { ctx.globalAlpha = 0.35 + 0.35 * Math.sin(gtime * 2 + s.p); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.s, s.s); }
  ctx.globalAlpha = 1;
  drawTiles(C);
  ctx.font = '22px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of items) {
    if (it.life < 2.5 && Math.floor(it.life * 8) % 2 === 0) continue;
    ctx.fillText(it.emoji, it.x + 12, it.y + 13);
  }
  for (const e of enemies) if (e.state !== 'trapped') drawEnemy(e);
  for (const b of bubbles) drawBubble(b);
  if (player && !(player.invuln > 0 && player.dying <= 0 && Math.floor(gtime * 12) % 2 === 0)) drawWizard(player);
  drawSparks();
  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.t * 2.5); ctx.fillStyle = q.color; ctx.beginPath(); ctx.arc(q.x, q.y, 2.5, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1;
  ctx.font = '18px Jua, sans-serif';
  for (const q of pops) {
    ctx.globalAlpha = Math.min(1, q.t * 2);
    ctx.lineWidth = 4; ctx.strokeStyle = '#120a26'; ctx.strokeText(q.text, q.x, q.y);
    ctx.fillStyle = q.color || '#ffffff'; ctx.fillText(q.text, q.x, q.y);
  }
  ctx.globalAlpha = 1;
  drawBossBar();
  if (state === 'intro') banner(`스테이지 ${stageIdx + 1}`, bossStage ? '⚠️ 태엽 마왕이 나타났어요!' : NAMES[stageIdx]);
  if (state === 'clear') banner('스테이지 클리어! ✨', stateT > 1 ? '남은 아이템을 주워요' : '');
  drawPowHud();
}
let lastPow = '';
function drawPowHud() {
  const p = player; let s = '';
  if (p && p.speedT > 0) s += `👟${Math.ceil(p.speedT)} `;
  if (p && p.bigT > 0) s += `🔮${Math.ceil(p.bigT)}`;
  if (s !== lastPow) { lastPow = s; $('hPow').textContent = s; }
}
function updHud() {
  $('hScore').textContent = '점수 ' + score;
  $('hStage').textContent = `스테이지 ${stageIdx + 1}/${MAPS.length}`;
  $('hLives').textContent = lives > 0 ? '❤️'.repeat(lives) : '💔';
  $('hBest').textContent = '최고 ' + Math.max(best, score);
}

/* ---------- 화면 안내 ---------- */
// acts: [[버튼 글자, 할 일], ...] 첫 번째 버튼은 Enter/스페이스로도 눌림
let ovActs = [];
function showOv(html, acts = []) {
  ovActs = acts;
  $('card').innerHTML = html + '<div class="btns">' + acts.map((a, i) => `<button data-i="${i}" class="${i ? 'sub' : ''}">${a[0]}</button>`).join('') + '</div>';
  for (const b of $('card').querySelectorAll('button[data-i]')) b.onclick = () => ovActs[+b.dataset.i][1]();
  $('ov').classList.remove('hide');
}
function hideOv() { $('ov').classList.add('hide'); }
function titleScreen() {
  loadStage(0); state = 'title';
  showOv(`<h1>🪄 방울 대작전</h1>
    <p>꼬마 마법사가 마법봉으로 방울을 쏴서 장난감 성을 지켜요!</p>
    <p>⬅️ ➡️ 이동 · ⬆️ 점프 · <b>스페이스</b> 방울 쏘기</p>
    <p>🫧 방울로 악당을 가두고 → 닿으면 펑! → 아이템이 나와요</p>
    <p>방울을 위에서 밟으면 통통 튀어 올라요 (밟은 방울은 터져요)</p>
    <p class="small">👻 유령은 시간이 지날수록 빨라지고 색이 변해요 · 갇힌 악당은 8초가 지나면 빠져나와요</p>
    <p class="small">❤️ 목숨 2개 · 스테이지를 깨면 목숨이 다시 채워져요</p>
    <p class="small">👑 마지막 스테이지에는 태엽 마왕이 기다려요. 방울을 ${BOSS_HP}번 맞히면 갇혀요! 💣 폭탄을 조심해요 (보스전은 목숨 ${BOSS_LIVES}개, 맞힐 때마다 아이템)</p>
    <p class="small">최고 점수 ${best} · P 일시정지 · M 소리 · 스테이지 ${MAPS.length}개</p>`,
    savedStage > 0
      ? [[`스테이지 ${savedStage + 1}부터 이어 하기`, () => startGame(savedStage)], ['처음부터', () => startGame(0)]]
      : [['시작하기', () => startGame(0)]]);
}
function togglePause() {
  if (!['intro', 'play', 'clear'].includes(state)) return;
  paused = !paused;
  if (paused) showOv(`<h1>일시정지 ⏸</h1><p>P 또는 Esc를 누르면 이어서 해요</p>`, [['계속하기', togglePause]]);
  else { hideOv(); last = performance.now(); }
}
function toggleMute() { muted = !muted; $('bMute').textContent = muted ? '🔇' : '🔊'; }

/* ---------- 입력 ---------- */
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'up', KeyW: 'up', Space: 'shoot', KeyX: 'shoot', KeyZ: 'shoot' };
function press(k, rep) {
  ensureAudio();
  if (k === 'shoot') { if (!rep) shootBuf = 0.12; }
  else { keys[k] = true; if (k === 'up' && !rep) jumpBuf = 0.12; }
}
function release(k) { if (k !== 'shoot') keys[k] = false; }
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k || e.code === 'Enter') e.preventDefault();
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (e.code === 'KeyP' || e.code === 'Escape') { togglePause(); return; }
  if (['title', 'over', 'win'].includes(state)) { if ((e.code === 'Enter' || e.code === 'Space') && !e.repeat && ovActs[0]) ovActs[0][1](); return; }
  if (paused || !k) return;
  press(k, e.repeat);
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) release(k); });
addEventListener('blur', () => { keys.left = keys.right = keys.up = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && !paused && ['intro', 'play', 'clear'].includes(state)) togglePause(); });
$('bPause').onclick = e => { e.currentTarget.blur(); togglePause(); };
$('bMute').onclick = e => { e.currentTarget.blur(); ensureAudio(); toggleMute(); };
if (matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
for (const btn of document.querySelectorAll('#touch button')) {
  const k = btn.dataset.k;
  btn.addEventListener('pointerdown', e => {
    e.preventDefault(); btn.setPointerCapture(e.pointerId); btn.classList.add('on');
    if (['title', 'over', 'win'].includes(state) || paused) return;
    press(k, false);
  });
  const up = () => { btn.classList.remove('on'); release(k); };
  btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up);
}

/* ---------- 돌리기 ---------- */
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  const d = Math.min(0.05, (now - last) / 1000); last = now;
  if (!paused) { acc += d; while (acc >= STEP) { update(STEP); acc -= STEP; } }
  draw();
  requestAnimationFrame(frame);
}
titleScreen();
requestAnimationFrame(frame);

// 검사용
window.BW = {
  get state() { return state; }, set state(v) { state = v; }, get stateT() { return stateT; }, set stateT(v) { stateT = v; },
  get player() { return player; }, get enemies() { return enemies; }, get bubbles() { return bubbles; }, get items() { return items; },
  get sparks() { return sparks; },
  setSpark(gap, rageGap) { SPARK_GAP = gap; SPARK_RAGE_GAP = rageGap; },
  get score() { return score; }, get lives() { return lives; }, get stageIdx() { return stageIdx; }, get grid() { return grid; },
  keys, MAPS, T, GRAV, JUMP_V, BOUNCE_V, PSPEED, moveBody, loadStage, startGame, update, rollItem, rollBossItem, popBubble, shoot,
  setShoot() { shootBuf = 0.12; }, setJump() { jumpBuf = 0.12; },
};
})();
