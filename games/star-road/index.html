<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="../../shared/home-button.js" data-pos="bottom-left"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>별게임</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #bfe9ff;
    --ink: #2f3a4a;
    --card: rgba(255, 255, 255, 0.94);
    --yellow: #ffc93c;
    --easy: #4cc38a;
    --hard: #ff6b6b;
    --blue: #4dabf7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(#bfe9ff, #e3f6ff);
    font-family: 'Jua', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 2 / 3));
    aspect-ratio: 2 / 3;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(30, 80, 120, 0.25);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .screen {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(191, 233, 255, 0.35);
  }
  .hidden { display: none !important; }
  .card {
    width: 100%; max-width: 400px; max-height: 100%; overflow-y: auto;
    background: var(--card); border-radius: 22px;
    padding: 22px 20px; text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  h1 { margin: 0; font-size: clamp(36px, 9vmin, 52px); color: #ff9f1c; text-shadow: 3px 3px 0 #fff3c4; }
  h2 { margin: 0 0 10px; font-size: 32px; }
  .sub { margin: 4px 0 14px; font-size: 18px; color: #5c6b7a; }
  .howto {
    text-align: left; background: #f1f9ff; border-radius: 14px;
    padding: 10px 14px; margin-bottom: 16px; font-size: 16px; line-height: 1.7;
  }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 18px; color: #fff; cursor: pointer;
    border: none; border-radius: 14px; padding: 12px 18px;
    background: var(--blue); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
    transition: transform 0.08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15); }
  button.big { flex: 1; min-width: 130px; font-size: 26px; padding: 14px 10px; }
  button.big small { display: block; font-size: 14px; opacity: 0.9; margin-top: 2px; }
  button.easy { background: var(--easy); }
  button.hard { background: var(--hard); }
  button.ghost { background: #e9eef3; color: var(--ink); }
  .mt { margin-top: 12px; }

  .result { display: flex; justify-content: center; gap: 16px; font-size: 18px; margin-bottom: 12px; }
  .result b { display: block; font-size: 30px; color: #ff9f1c; }
  #entry { background: #fff8e1; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  #entry p { margin: 0 0 8px; }
  #entry input {
    font-family: inherit; font-size: 20px; width: 150px; padding: 8px 10px;
    border: 2px solid #ffd166; border-radius: 10px; text-align: center; outline: none;
  }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 10px; }
  .tabs button { padding: 8px 18px; background: #e9eef3; color: var(--ink); }
  .tabs button.on.easy { background: var(--easy); color: #fff; }
  .tabs button.on.hard { background: var(--hard); color: #fff; }
  ol.rank { list-style: none; padding: 0; margin: 0 0 12px; text-align: left; }
  ol.rank li {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 12px; border-radius: 10px; font-size: 18px;
  }
  ol.rank li:nth-child(odd) { background: #f4f7fa; }
  ol.rank li.me { background: #fff1b8; outline: 2px solid var(--yellow); }
  ol.rank .no { width: 30px; text-align: center; }
  ol.rank .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.rank .lv { font-size: 13px; color: #8a97a5; }
  ol.rank .sc { width: 54px; text-align: right; color: #ff9f1c; }
  ol.rank li.empty { justify-content: center; color: #8a97a5; background: none; }

  .corner {
    position: absolute; width: 11%; aspect-ratio: 1; padding: 0; font-size: clamp(16px, 4vmin, 22px);
    background: rgba(255, 255, 255, 0.85); color: var(--ink); border-radius: 50%;
  }
  #btn-pause { left: 3%; top: 11.5%; }
  #btn-sound { right: 3%; top: 11.5%; }
  .touch {
    position: absolute; bottom: 3%; width: 14%; aspect-ratio: 1; padding: 0;
    font-size: clamp(20px, 6vmin, 32px); background: rgba(255, 255, 255, 0.7); color: var(--ink);
    border-radius: 50%; display: none;
  }
  #btn-left { left: 1.5%; }
  #btn-right { right: 1.5%; }
  @media (pointer: coarse) { .touch.show { display: block; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <button id="btn-pause" class="corner hidden" title="일시정지 (P)">⏸</button>
  <button id="btn-sound" class="corner hidden" title="소리 켜기/끄기">🔊</button>
  <button id="btn-left" class="touch">◀</button>
  <button id="btn-right" class="touch">▶</button>

  <div id="screen-title" class="screen">
    <div class="card">
      <h1>⭐ 별게임</h1>
      <p class="sub">도로를 달리며 별을 모아요!</p>
      <div class="howto">
        🚗 <b>← →</b> 키로 차선을 바꿔요 (화면 터치도 돼요)<br>
        ⭐ 노란 별 1점 · 🌟 금색 별 2점<br>
        🚧 고깔 · 공사 표시 · 끊긴 길에 닿으면 목숨이 줄어요<br>
        🚀 별 20개마다 레벨 업! 점점 빨라져요
      </div>
      <div class="row">
        <button class="big easy" data-diff="easy">쉬움<small>목숨 5개</small></button>
        <button class="big hard" data-diff="hard">어려움<small>목숨 3개 · 더 빨라요</small></button>
      </div>
      <button id="btn-rank" class="ghost mt">🏆 랭킹 보기</button>
    </div>
  </div>

  <div id="screen-pause" class="screen hidden">
    <div class="card">
      <h2>잠깐 쉬는 중</h2>
      <div class="row">
        <button id="btn-resume" class="easy">계속하기</button>
        <button id="btn-quit" class="ghost">처음으로</button>
      </div>
    </div>
  </div>

  <div id="screen-over" class="screen hidden">
    <div class="card">
      <h2>게임 끝!</h2>
      <div class="result">
        <div>점수<b id="r-score">0</b></div>
        <div>모은 별<b id="r-stars">0</b></div>
        <div>레벨<b id="r-level">1</b></div>
      </div>
      <div id="entry">
        <p id="entry-msg">🎉 순위에 들었어요! 이름을 적어 주세요</p>
        <input id="name" maxlength="8" placeholder="이름" autocomplete="off">
        <button id="btn-save">등록</button>
      </div>
      <p id="over-diff" class="sub"></p>
      <ol id="rank-over" class="rank"></ol>
      <div class="row">
        <button id="btn-retry" class="easy">다시 하기</button>
        <button id="btn-home" class="ghost">처음으로</button>
      </div>
    </div>
  </div>

  <div id="screen-rank" class="screen hidden">
    <div class="card">
      <h2>🏆 랭킹</h2>
      <div class="tabs">
        <button data-tab="easy" class="easy on">쉬움</button>
        <button data-tab="hard" class="hard">어려움</button>
      </div>
      <ol id="rank-list" class="rank"></ol>
      <button id="btn-rank-back" class="ghost">돌아가기</button>
    </div>
  </div>
</div>

<script>
// ===== 기본 설정 =====
const W = 480, H = 720;
const LANES = 4, LANE_W = 80, ROAD_X = 80;
const CAR_Y = 610;
const STARS_PER_LEVEL = 20;
const GOLD_GAP = 6;   // 금색 별 사이 최소 줄 수
const DIFF = {
  easy: { name: '쉬움', lives: 5, base: 250, step: 0.12, max: 2.0, maxObs: 2 },
  hard: { name: '어려움', lives: 3, base: 320, step: 0.14, max: 2.3, maxObs: 3 },
};
const laneX = l => ROAD_X + LANE_W * l + LANE_W / 2;
const rnd = n => Math.floor(Math.random() * n);

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = W * dpr; cvs.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ===== 저장 (랭킹, 이름, 소리) =====
const RANK_KEY = 'byeolgame.ranking.v1';
let memRank = { easy: [], hard: [] };
function loadRank() {
  try {
    const s = JSON.parse(localStorage.getItem(RANK_KEY));
    if (s && Array.isArray(s.easy) && Array.isArray(s.hard)) return s;
  } catch (e) {}
  return memRank;
}
function saveRank(r) {
  memRank = r;
  try { localStorage.setItem(RANK_KEY, JSON.stringify(r)); } catch (e) {}
}
function qualifies(diff, score) {
  const list = loadRank()[diff];
  return score > 0 && (list.length < 10 || score > list[list.length - 1].score);
}
function addRank(diff, entry) {
  const r = loadRank();
  r[diff].push(entry);
  r[diff].sort((a, b) => b.score - a.score || a.time - b.time);
  r[diff] = r[diff].slice(0, 10);
  saveRank(r);
  return r[diff].indexOf(entry);
}
function getPref(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function setPref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

// ===== 소리 =====
let actx = null;
let muted = getPref('byeolgame.muted', '0') === '1';
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function sfx(name) {
  if (muted || !actx) return;
  const t = actx.currentTime;
  const tone = (f, st, d, type = 'triangle', v = 0.12) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t + st);
    g.gain.setValueAtTime(v, t + st);
    g.gain.exponentialRampToValueAtTime(0.001, t + st + d);
    o.connect(g).connect(actx.destination);
    o.start(t + st); o.stop(t + st + d + 0.02);
  };
  if (name === 'star') { tone(880, 0, 0.1); tone(1320, 0.06, 0.15); }
  if (name === 'gold') { tone(988, 0, 0.1); tone(1319, 0.07, 0.1); tone(1760, 0.14, 0.22); }
  if (name === 'hit') { tone(180, 0, 0.3, 'sawtooth', 0.12); tone(110, 0.05, 0.35, 'square', 0.07); }
  if (name === 'level') [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.2));
  if (name === 'count') tone(600, 0, 0.12, 'square', 0.05);
  if (name === 'go') tone(900, 0, 0.3, 'square', 0.06);
  if (name === 'over') [392, 330, 262].forEach((f, i) => tone(f, i * 0.18, 0.32));
}

// ===== 배경 장식 (나무, 꽃, 덤불) =====
const decor = [];
function randomDecor(d, y) {
  const left = d.side === 0;
  d.kind = ['tree', 'tree', 'flower', 'bush'][rnd(4)];
  d.x = left ? 12 + Math.random() * 52 : W - 64 + Math.random() * 52;
  d.y = y;
  d.c = ['#ff8fab', '#ffd43b', '#ffffff', '#b197fc'][rnd(4)];
}
for (let side = 0; side < 2; side++) {
  for (let i = 0; i < 7; i++) {
    const d = { side };
    randomDecor(d, i * (H / 7) + Math.random() * 40);
    decor.push(d);
  }
}
function moveDecor(dist) {
  for (const d of decor) {
    d.y += dist;
    if (d.y > H + 50) randomDecor(d, d.y - H - 130);
  }
}

// ===== 게임 상태 =====
let mode = 'title';       // title | play | pause | over
let game = null;
let idleScroll = 0;
let lastDiff = 'easy';

function newGame(diff) {
  const d = DIFF[diff];
  return {
    diff, d,
    lives: d.lives, score: 0, stars: 0, level: 1,
    speed: d.base, scroll: 0,
    lane: 1, carX: laneX(1), tilt: 0,
    objects: [], particles: [], texts: [],
    laneBlock: [0, 0, 0, 0], midGap: 0, spawnAcc: -250, goldCool: 3,
    invuln: 0, shake: 0, banner: null,
    countdown: 3, dead: false, deadT: 0,
  };
}

function moveCar(dir) {
  if (!game || mode !== 'play' || game.dead) return;
  game.lane = Math.max(0, Math.min(LANES - 1, game.lane + dir));
}

// ===== 별과 장애물 만들기 =====
function addStar(lane, y, gold) {
  // 금색 별은 한 번 나오면 최소 GOLD_GAP 줄이 지나야 다시 나와요
  if (gold) {
    if (game.goldCool > 0) gold = false;
    else game.goldCool = GOLD_GAP;
  }
  game.objects.push({ type: 'star', lane, x: laneX(lane), y, gold, r: gold ? 19 : 15, rot: Math.random() * 6 });
}
function addObstacle(lane) {
  const cone = Math.random() < 0.6;
  const o = cone
    ? { type: 'cone', w: 44, h: 50 }
    : { type: 'barrier', w: 62, h: 44 };
  o.lane = lane; o.x = laneX(lane); o.y = -20 - o.h; o.rot = 0;
  game.objects.push(o);
  game.laneBlock[lane] = o.h + 40;
}
function addGap(lane, len) {
  const holes = [];
  for (let i = 0; i < Math.floor(len / 70); i++) {
    holes.push({ dx: (Math.random() - 0.5) * 40, dy: 30 + Math.random() * (len - 60), rx: 10 + Math.random() * 10, ry: 6 + Math.random() * 6 });
  }
  game.objects.push({ type: 'gap', lane, x: laneX(lane), y: -20 - len, h: len, w: LANE_W - 6, holes });
  game.laneBlock[lane] = len + 60;
}

function spawnRow() {
  const g = game;
  const free = [];
  for (let l = 0; l < LANES; l++) if (g.laneBlock[l] <= 0) free.push(l);
  const rowY = -45;
  g.goldCool--;

  // 가운데 차선이 끊겨 있는 동안에는 별만 나와요 (길이 막히지 않게)
  if (g.midGap > 0) {
    const l = free[rnd(free.length)];
    if (Math.random() < 0.7) addStar(l, rowY, false);
    return;
  }

  // 끊긴 차선 (공사 구간)
  const anyBlock = g.laneBlock.some(b => b > 0);
  const gapChance = Math.min(0.3, 0.12 + 0.03 * (g.level - 1));
  if (!anyBlock && Math.random() < gapChance) {
    const middle = Math.random() < 0.3;
    const lane = middle ? 1 + rnd(2) : (Math.random() < 0.5 ? 0 : 3);
    const len = 240 + Math.random() * 200;
    addGap(lane, len);
    if (middle) g.midGap = len + 60;
    // 위험한 곳 옆에 금색 별
    const side = [lane - 1, lane + 1].filter(l => l >= 0 && l < LANES);
    if (Math.random() < 0.4) addStar(side[rnd(side.length)], -20 - len / 2, true);
    return;
  }

  // 쉬어가는 줄: 별만
  if (Math.random() < 0.15) {
    const l = free[rnd(free.length)];
    for (let i = 0; i < 3; i++) addStar(l, rowY - i * 55, false);
    return;
  }

  // 고깔 / 공사 표시
  let n = 1;
  if (Math.random() < 0.2 + 0.06 * (g.level - 1)) n++;
  if (g.level >= 4 && Math.random() < 0.15) n++;
  n = Math.min(n, g.d.maxObs, free.length - 1);
  const lanes = free.slice().sort(() => Math.random() - 0.5);
  const obs = lanes.slice(0, n), rest = lanes.slice(n);
  obs.forEach(addObstacle);
  for (const l of rest) {
    const nearDanger = obs.some(o => Math.abs(o - l) === 1);
    if (nearDanger && Math.random() < 0.12) addStar(l, rowY, true);
    else if (Math.random() < 0.45) addStar(l, rowY, false);
  }
}

// ===== 업데이트 =====
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 80 + Math.random() * 160;
    game.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.5 + Math.random() * 0.3, c: color });
  }
}

function collect(o) {
  const g = game;
  o.taken = true;
  const v = o.gold ? 2 : 1;
  g.score += v; g.stars++;
  g.texts.push({ x: o.x, y: o.y, s: '+' + v, t: 0.8, c: o.gold ? '#ff9f1c' : '#f6c000' });
  burst(o.x, o.y, o.gold ? '#ffb703' : '#ffe066', o.gold ? 14 : 8);
  sfx(o.gold ? 'gold' : 'star');
  if (g.stars % STARS_PER_LEVEL === 0) {
    g.level++;
    g.banner = { t: 1.8 };
    sfx('level');
  }
}

function hit(o) {
  const g = game;
  g.lives--; g.invuln = 1.6; g.shake = 0.35;
  g.texts.push({ x: g.carX, y: CAR_Y - 50, s: '앗!', t: 0.9, c: '#ff4d6d' });
  sfx('hit');
  if (o.type !== 'gap') {
    o.knocked = true;
    o.vx = (o.x < g.carX ? -1 : 1) * (200 + Math.random() * 100);
    o.vr = (Math.random() < 0.5 ? -1 : 1) * 8;
  }
  if (g.lives <= 0) { g.dead = true; g.deadT = 1.3; sfx('over'); }
}

function update(dt) {
  const g = game;

  const prevX = g.carX;
  g.carX += (laneX(g.lane) - g.carX) * Math.min(1, dt * 16);
  g.tilt = Math.max(-1, Math.min(1, (g.carX - prevX) / dt / 500));

  if (g.countdown > 0) {
    const before = Math.ceil(g.countdown);
    g.countdown -= dt;
    if (g.countdown <= 0) sfx('go');
    else if (Math.ceil(g.countdown) !== before) sfx('count');
    return;
  }
  if (g.countdown > -1) g.countdown -= dt;   // '출발!' 글자가 잠깐만 보이게

  if (g.dead) {
    g.speed *= Math.pow(0.15, dt);
    g.deadT -= dt;
    if (g.deadT <= 0) { showGameOver(); return; }
  } else {
    g.speed = g.d.base * Math.min(g.d.max, 1 + g.d.step * (g.level - 1));
  }

  const dist = g.speed * dt;
  g.scroll += dist;
  moveDecor(dist);
  for (let l = 0; l < LANES; l++) g.laneBlock[l] -= dist;
  g.midGap -= dist;

  if (!g.dead) {
    g.spawnAcc += dist;
    const spacing = Math.max(180, g.speed * 0.62);
    if (g.spawnAcc >= spacing) { g.spawnAcc -= spacing; spawnRow(); }
  }

  for (const o of g.objects) {
    o.y += dist;
    if (o.type === 'star') o.rot += dt * 2;
    if (o.knocked) { o.x += o.vx * dt; o.rot += o.vr * dt; o.y -= dist * 0.5; }
  }

  // 부딪힘 검사
  const cx = g.carX;
  for (const o of g.objects) {
    if (o.taken || o.knocked) continue;
    if (o.type === 'star') {
      if (Math.abs(o.x - cx) < o.r + 16 && Math.abs(o.y - CAR_Y) < o.r + 30) collect(o);
    } else if (!g.dead && g.invuln <= 0) {
      const hw = o.w / 2 - 6;
      if (Math.abs(o.x - cx) < hw + 16 && CAR_Y + 28 > o.y + 8 && CAR_Y - 28 < o.y + o.h - 8) hit(o);
    }
  }
  g.objects = g.objects.filter(o => !o.taken && o.y < H + 40 && o.x > -80 && o.x < W + 80);

  for (const p of g.particles) { p.x += p.vx * dt; p.y += p.vy * dt + dist; p.t -= dt; }
  g.particles = g.particles.filter(p => p.t > 0);
  for (const t of g.texts) { t.y -= 60 * dt; t.t -= dt; }
  g.texts = g.texts.filter(t => t.t > 0);

  g.invuln -= dt;
  g.shake = Math.max(0, g.shake - dt);
  if (g.banner) { g.banner.t -= dt; if (g.banner.t <= 0) g.banner = null; }
}

// ===== 그리기 도구 =====
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function starPath(x, y, r, rot) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot - Math.PI / 2 + i * Math.PI / 5;
    const rad = i % 2 ? r * 0.48 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
}
function stripes(x, y, w, h) {
  ctx.save();
  rr(x, y, w, h, 3); ctx.clip();
  ctx.fillStyle = '#fff'; ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#ff7a1a'; ctx.lineWidth = 6;
  for (let i = -h; i < w + h; i += 14) {
    ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke();
  }
  ctx.restore();
}

// ===== 그리기 =====
function drawScenery(scroll) {
  // 잔디 줄무늬
  const band = 40, off = scroll % (band * 2);
  for (let y = -band * 2 + off; y < H; y += band) {
    const even = Math.round((y - off) / band) % 2 === 0;
    ctx.fillStyle = even ? '#8fdc6a' : '#84d45e';
    ctx.fillRect(0, y, W, band);
  }
  // 도로
  ctx.fillStyle = '#6c7682';
  ctx.fillRect(ROAD_X, 0, LANES * LANE_W, H);
  // 빨강·하양 연석
  const cOff = scroll % 40;
  for (let y = -40 + cOff; y < H; y += 20) {
    const red = Math.round((y - cOff) / 20) % 2 === 0;
    ctx.fillStyle = red ? '#ff6b6b' : '#ffffff';
    ctx.fillRect(ROAD_X - 7, y, 7, 20);
    ctx.fillRect(ROAD_X + LANES * LANE_W, y, 7, 20);
  }
  // 차선 점선
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const dOff = scroll % 80;
  for (let l = 1; l < LANES; l++) {
    const x = ROAD_X + l * LANE_W - 3;
    for (let y = -80 + dOff; y < H; y += 80) ctx.fillRect(x, y, 6, 40);
  }
  // 나무, 꽃, 덤불
  for (const d of decor) {
    if (d.kind === 'tree') {
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath(); ctx.arc(d.x + 5, d.y + 6, 22, 0, 7); ctx.fill();
      ctx.fillStyle = '#3fa34d';
      ctx.beginPath(); ctx.arc(d.x, d.y, 22, 0, 7); ctx.fill();
      ctx.fillStyle = '#5cc265';
      ctx.beginPath(); ctx.arc(d.x - 6, d.y - 6, 12, 0, 7); ctx.fill();
    } else if (d.kind === 'bush') {
      ctx.fillStyle = '#4fb35a';
      ctx.beginPath(); ctx.arc(d.x - 8, d.y, 11, 0, 7); ctx.arc(d.x + 8, d.y + 2, 12, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = d.c;
      for (let i = 0; i < 5; i++) {
        const a = i * Math.PI * 2 / 5;
        ctx.beginPath(); ctx.arc(d.x + Math.cos(a) * 6, d.y + Math.sin(a) * 6, 5, 0, 7); ctx.fill();
      }
      ctx.fillStyle = '#ffb703';
      ctx.beginPath(); ctx.arc(d.x, d.y, 4, 0, 7); ctx.fill();
    }
  }
}

function drawCar(x, y, tilt, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(tilt * 0.22);
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; rr(-18, -30, 44, 72, 12); ctx.fill();
  ctx.fillStyle = '#2b2b2b';
  for (const [wx, wy] of [[-26, -26], [20, -26], [-26, 12], [20, 12]]) { rr(wx, wy, 6, 16, 3); ctx.fill(); }
  ctx.fillStyle = '#ff4d5a'; rr(-21, -36, 42, 72, 12); ctx.fill();
  ctx.fillStyle = '#ff858d'; rr(-15, -32, 30, 12, 6); ctx.fill();
  ctx.fillStyle = '#bfe8ff'; rr(-16, -16, 32, 14, 4); ctx.fill();
  ctx.fillStyle = '#e63946'; rr(-15, 0, 30, 18, 6); ctx.fill();
  ctx.fillStyle = '#9fd8f5'; rr(-14, 21, 28, 8, 3); ctx.fill();
  ctx.fillStyle = '#fff3a0';
  ctx.beginPath(); ctx.arc(-13, -33, 4, 0, 7); ctx.arc(13, -33, 4, 0, 7); ctx.fill();
  ctx.restore();
}

function drawStar(o) {
  ctx.save();
  const pulse = 1 + Math.sin(o.rot * 2) * 0.06;
  if (o.gold) {
    ctx.fillStyle = 'rgba(255,183,3,0.25)';
    ctx.beginPath(); ctx.arc(o.x, o.y, o.r + 9, 0, 7); ctx.fill();
  }
  starPath(o.x, o.y + 3, o.r * pulse, o.rot * 0.3);
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; ctx.fill();
  starPath(o.x, o.y, o.r * pulse, o.rot * 0.3);
  ctx.fillStyle = o.gold ? '#ffb703' : '#ffe14d'; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = o.gold ? '#e07b00' : '#f2b705'; ctx.stroke();
  if (o.gold) {
    ctx.fillStyle = '#fff'; ctx.font = '16px Jua, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('2', o.x, o.y + 1);
  }
  ctx.restore();
}

function drawCone(o) {
  ctx.save();
  ctx.translate(o.x, o.y + o.h / 2); ctx.rotate(o.rot);
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(3, 22, 22, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#e8590c'; rr(-20, 14, 40, 10, 3); ctx.fill();
  ctx.fillStyle = '#ff8c1a';
  ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(15, 14); ctx.lineTo(-15, 14); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(-7, -6); ctx.lineTo(7, -6); ctx.lineTo(10, 3); ctx.lineTo(-10, 3); ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawBarrier(o, time) {
  ctx.save();
  ctx.translate(o.x, o.y + o.h / 2); ctx.rotate(o.rot);
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; rr(-28, 10, 62, 10, 4); ctx.fill();
  ctx.fillStyle = '#495057';
  ctx.fillRect(-25, 4, 5, 16); ctx.fillRect(20, 4, 5, 16);
  stripes(-31, -12, 62, 20);
  ctx.strokeStyle = '#d9480f'; ctx.lineWidth = 2; rr(-31, -12, 62, 20, 3); ctx.stroke();
  ctx.fillStyle = Math.floor(time * 3) % 2 ? '#ffd43b' : '#ff922b';
  ctx.beginPath(); ctx.arc(0, -17, 6, 0, 7); ctx.fill();
  ctx.restore();
}

function drawGap(o) {
  const x = o.x - o.w / 2;
  ctx.fillStyle = '#b08155'; rr(x, o.y, o.w, o.h, 8); ctx.fill();
  ctx.fillStyle = '#7f5534';
  for (const hl of o.holes) {
    ctx.beginPath(); ctx.ellipse(o.x + hl.dx, o.y + hl.dy, hl.rx, hl.ry, 0, 0, 7); ctx.fill();
  }
  stripes(x, o.y, o.w, 14);
  stripes(x, o.y + o.h - 14, o.w, 14);
  ctx.fillStyle = '#ffd43b'; rr(o.x - 30, o.y + o.h / 2 - 14, 60, 28, 7); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#333'; ctx.font = '17px Jua, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('공사중', o.x, o.y + o.h / 2 + 1);
}

function outlinedText(s, x, y, size, fill) {
  ctx.font = size + 'px Jua, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size / 6; ctx.strokeStyle = '#fff';
  ctx.strokeText(s, x, y);
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}

function drawHUD(g) {
  ctx.fillStyle = 'rgba(255,255,255,0.93)'; rr(10, 10, W - 20, 58, 16); ctx.fill();
  ctx.textBaseline = 'middle';
  ctx.font = '24px Jua, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#2f3a4a';
  ctx.fillText('⭐ ' + g.score, 24, 40);
  ctx.textAlign = 'center'; ctx.font = '18px Jua, sans-serif';
  ctx.fillText('레벨 ' + g.level, 240, 28);
  ctx.fillStyle = '#e9ecef'; rr(180, 42, 120, 12, 6); ctx.fill();
  const p = (g.stars % STARS_PER_LEVEL) / STARS_PER_LEVEL;
  if (p > 0) { ctx.fillStyle = '#ffc93c'; rr(180, 42, Math.max(12, 120 * p), 12, 6); ctx.fill(); }
  ctx.font = '22px Jua, sans-serif';
  for (let i = 0; i < g.d.lives; i++) {
    ctx.fillStyle = i < g.lives ? '#ff4d6d' : '#d5dbe1';
    ctx.fillText('♥', W - 34 - i * 22, 40);
  }
}

let clock = 0;
function draw() {
  ctx.save();
  if (!game) {
    drawScenery(idleScroll);
    drawCar(laneX(1), CAR_Y, 0, 1);
    ctx.restore();
    return;
  }
  const g = game;
  if (g.shake > 0) ctx.translate((Math.random() - 0.5) * g.shake * 24, (Math.random() - 0.5) * g.shake * 24);
  drawScenery(g.scroll);
  for (const o of g.objects) if (o.type === 'gap') drawGap(o);
  for (const o of g.objects) if (o.type === 'star') drawStar(o);
  for (const o of g.objects) {
    if (o.type === 'cone') drawCone(o);
    if (o.type === 'barrier') drawBarrier(o, clock);
  }
  const blink = g.invuln > 0 && Math.floor(g.invuln * 10) % 2 === 0;
  drawCar(g.carX, CAR_Y, g.tilt, blink ? 0.35 : 1);
  for (const p of g.particles) {
    ctx.globalAlpha = Math.min(1, p.t * 2); ctx.fillStyle = p.c;
    starPath(p.x, p.y, 5, 0); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for (const t of g.texts) {
    ctx.globalAlpha = Math.min(1, t.t * 2);
    outlinedText(t.s, t.x, t.y, 28, t.c);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD(g);
  if (g.countdown > 0) {
    const n = Math.ceil(g.countdown);
    const k = 1 + (g.countdown % 1) * 0.5;
    ctx.save(); ctx.translate(W / 2, H / 2 - 40); ctx.scale(k, k);
    outlinedText(String(n), 0, 0, 110, '#ff9f1c');
    ctx.restore();
  } else if (g.countdown > -0.7 && !g.dead) {
    outlinedText('출발!', W / 2, H / 2 - 40, 80, '#4cc38a');
  }
  if (g.banner) {
    const a = Math.min(1, g.banner.t * 2);
    ctx.globalAlpha = a;
    outlinedText('레벨 업! 🚀', W / 2, H / 2 - 60, 60, '#4dabf7');
    outlinedText('조금 더 빨라져요', W / 2, H / 2, 26, '#2f3a4a');
    ctx.globalAlpha = 1;
  }
}

// ===== 화면 전환 =====
const $ = id => document.getElementById(id);
const screens = ['screen-title', 'screen-pause', 'screen-over', 'screen-rank'];
function show(id) { screens.forEach(s => $(s).classList.toggle('hidden', s !== id)); }
function setHud(on) {
  $('btn-pause').classList.toggle('hidden', !on);
  $('btn-sound').classList.toggle('hidden', !on);
  $('btn-left').classList.toggle('show', on);
  $('btn-right').classList.toggle('show', on);
}
function updateSoundBtn() { $('btn-sound').textContent = muted ? '🔇' : '🔊'; }

function startGame(diff) {
  ensureAudio();
  lastDiff = diff;
  game = newGame(diff);
  mode = 'play';
  show(null); setHud(true);
  sfx('count');
}
function goTitle() {
  game = null; mode = 'title';
  show('screen-title'); setHud(false);
}
function pause() {
  if (mode !== 'play' || game.dead) return;
  mode = 'pause'; show('screen-pause');
}
function resume() {
  if (mode !== 'pause') return;
  mode = 'play'; show(null);
}

let savedIndex = -1;
function showGameOver() {
  const g = game;
  mode = 'over'; setHud(false);
  $('r-score').textContent = g.score;
  $('r-stars').textContent = g.stars;
  $('r-level').textContent = g.level;
  $('over-diff').textContent = g.d.name + ' 랭킹';
  savedIndex = -1;
  const ok = qualifies(g.diff, g.score);
  $('entry').classList.toggle('hidden', !ok);
  renderRank($('rank-over'), loadRank()[g.diff], -1);
  show('screen-over');
  if (ok) {
    $('name').value = getPref('byeolgame.lastName', '');
    setTimeout(() => $('name').focus(), 50);
  }
}
function saveScore() {
  const g = game;
  const name = $('name').value.trim() || '이름없음';
  setPref('byeolgame.lastName', name);
  const entry = { name, score: g.score, stars: g.stars, level: g.level, time: Date.now() };
  savedIndex = addRank(g.diff, entry);
  $('entry').classList.add('hidden');
  renderRank($('rank-over'), loadRank()[g.diff], savedIndex);
}
function renderRank(ol, list, me) {
  ol.textContent = '';
  if (!list.length) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = '아직 기록이 없어요. 첫 주인공이 되어 보세요!';
    ol.appendChild(li);
    return;
  }
  list.forEach((e, i) => {
    const li = document.createElement('li');
    if (i === me) li.className = 'me';
    const no = document.createElement('span'); no.className = 'no';
    no.textContent = ['🥇', '🥈', '🥉'][i] || (i + 1);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = e.name;
    const lv = document.createElement('span'); lv.className = 'lv'; lv.textContent = '레벨 ' + e.level;
    const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = e.score + '점';
    li.append(no, nm, lv, sc);
    ol.appendChild(li);
  });
}
let rankTab = 'easy';
function showRankScreen() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === rankTab));
  renderRank($('rank-list'), loadRank()[rankTab], -1);
  show('screen-rank');
}

// ===== 입력 =====
document.querySelectorAll('[data-diff]').forEach(b => b.addEventListener('click', () => startGame(b.dataset.diff)));
$('btn-rank').addEventListener('click', () => { rankTab = 'easy'; showRankScreen(); });
$('btn-rank-back').addEventListener('click', () => show('screen-title'));
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { rankTab = b.dataset.tab; showRankScreen(); }));
$('btn-pause').addEventListener('click', pause);
$('btn-resume').addEventListener('click', resume);
$('btn-quit').addEventListener('click', goTitle);
$('btn-save').addEventListener('click', saveScore);
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') saveScore(); });
$('btn-retry').addEventListener('click', () => startGame(lastDiff));
$('btn-home').addEventListener('click', goTitle);
$('btn-sound').addEventListener('click', () => {
  muted = !muted; setPref('byeolgame.muted', muted ? '1' : '0'); updateSoundBtn();
});
$('btn-left').addEventListener('pointerdown', e => { e.preventDefault(); moveCar(-1); });
$('btn-right').addEventListener('pointerdown', e => { e.preventDefault(); moveCar(1); });
cvs.addEventListener('pointerdown', e => {
  const r = cvs.getBoundingClientRect();
  moveCar(e.clientX - r.left < r.width / 2 ? -1 : 1);
});

window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (mode === 'play') {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); if (!e.repeat) moveCar(-1); }
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); if (!e.repeat) moveCar(1); }
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') pause();
  } else if (mode === 'pause') {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape' || e.key === 'Enter') resume();
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

// ===== 메인 루프 =====
let last = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;
  clock += dt;
  if (mode === 'play') update(dt);
  else if (mode === 'title') { idleScroll += 120 * dt; moveDecor(120 * dt); }
  draw();
  requestAnimationFrame(frame);
}
updateSoundBtn();
requestAnimationFrame(frame);
</script>
</body>
</html>
