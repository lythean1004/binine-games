<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="../../shared/home-button.js" data-pos="bottom-left"></script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀 실험실 탈출</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #0f1626;
    --line: #22304a;
    --text: #d6e2f0;
    --dim: #7f91ab;
    --glow: #3cf0c8;
    --danger: #ff4d6d;
    --purple: #b46cff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% 0%, #10203a 0%, var(--bg) 60%);
    color: var(--text); font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    display: flex; justify-content: center; padding-block: 12px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #app { width: 100%; max-width: 560px; }
  #top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  #roomName { font-weight: bold; color: var(--glow); text-shadow: 0 0 8px rgba(60,240,200,.5); white-space: nowrap; }
  #gauge { flex: 1; height: 18px; background: #1a0f14; border: 1px solid #3a2030; border-radius: 9px; overflow: hidden; position: relative; }
  #gaugeFill { height: 100%; width: 100%; background: linear-gradient(90deg, #2bd17e, #8cf06a); transition: background .5s; }
  #timeText { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #fff; text-shadow: 0 0 3px #000; }
  #gauge.low { animation: blink .6s infinite; }
  @keyframes blink { 50% { box-shadow: 0 0 12px var(--danger); } }
  button {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--glow); }
  button:disabled { opacity: .4; cursor: default; }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: #05080f; image-rendering: auto; }
  #msg { min-height: 44px; margin-top: 8px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font-size: 14px; line-height: 1.5; }
  #bagWrap { margin-top: 8px; }
  #bagWrap .label { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  #bag { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .slot { aspect-ratio: 1; background: #0b111e; border: 1px dashed var(--line); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; padding: 2px; }
  .slot.has { border-style: solid; cursor: pointer; }
  .slot.has:hover { border-color: var(--glow); }
  .slot small { font-size: 9px; color: var(--dim); text-align: center; line-height: 1.1; margin-top: 2px; }
  #controls { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; font-size: 12px; color: var(--dim); align-items: center; }
  .overlay { position: fixed; inset: 0; background: rgba(3,6,12,.82); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .overlay.show { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; max-width: 460px; width: 100%; max-height: 90vh; overflow: auto; box-shadow: 0 0 40px rgba(60,240,200,.12); }
  .card h2 { margin: 0 0 10px; color: var(--glow); }
  .card p { line-height: 1.6; margin: 8px 0; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .big { padding: 10px 18px; font-size: 16px; border-color: var(--glow); }
  .slots4 { display: flex; gap: 8px; justify-content: center; margin: 12px 0; }
  .slots4 div { width: 46px; height: 46px; border-radius: 50%; border: 2px dashed var(--line); }
  .swatch { width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.2); cursor: pointer; }
  .keys { display: grid; grid-template-columns: repeat(3, 60px); gap: 6px; justify-content: center; margin-top: 10px; }
  .keys button { height: 46px; font-size: 18px; }
  .codebox { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
  .codebox div { width: 42px; height: 52px; border: 1px solid var(--glow); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-family: monospace; color: var(--glow); background: #061410; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .ptable { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 10px; }
  .ptable div { background: #13213a; border: 1px solid #2a3d60; border-radius: 4px; padding: 3px 0; text-align: center; font-size: 10px; }
  .ptable b { display: block; font-size: 15px; color: #fff; }
  .ptable .e { background: none; border: none; }
  .diary { background: #e9dcc0; color: #3a2a18; border-radius: 8px; padding: 14px; font-family: "Gungsuh", serif; line-height: 1.8; }
  .terminal { background: #021008; border: 1px solid #1f6b48; border-radius: 8px; padding: 12px; font-family: monospace; color: #5dffa8; }
  .hint { background: #1c1a0c; border: 1px solid #6a5a1a; border-radius: 8px; padding: 12px; }
  .stat { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding: 6px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span id="roomName">🧪 약품 보관실</span>
    <div id="gauge"><div id="gaugeFill"></div><div id="timeText">15:00</div></div>
    <button id="hintBtn" title="힌트 (방마다 1번)">💡</button>
    <button id="soundBtn" title="소리">🔊</button>
    <button id="pauseBtn" title="일시정지 (P)">⏸</button>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="controls">
    <button id="rotL">⟲ &lt;</button>
    <button id="rotR">&gt; ⟳</button>
    <span>WASD 이동 · 물건 클릭으로 조사 · &lt; &gt; 방 돌리기 · P 일시정지</span>
  </div>
  <div id="msg"></div>
  <div id="bagWrap">
    <div class="label">🎒 가방 (클릭해서 사용·읽기)</div>
    <div id="bag"></div>
  </div>
</div>

<div class="overlay" id="modal"><div class="card" id="modalCard"></div></div>

<script>
// ===== 기본 설정 =====
const N = 10, T = 48, OY = 50, WALL_H = 0.9;
const MAX_TIME = 15 * 60, ANTIDOTE_TIME = 2 * 60;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const CW = N * T, CH = N * T + OY;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
cv.width = CW * DPR; cv.height = CH * DPR;
ctx.scale(DPR, DPR);

const $ = id => document.getElementById(id);

// ===== 소리 =====
let actx = null, soundOn = true;
function beep(freq, dur = 0.12, type = 'sine', vol = 0.08, slide = 0) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, actx.currentTime + dur);
    g.gain.value = vol; g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  pick: () => { beep(660, .08); setTimeout(() => beep(990, .1), 70); },
  ok: () => { beep(523, .1); setTimeout(() => beep(659, .1), 90); setTimeout(() => beep(784, .18), 180); },
  bad: () => beep(140, .25, 'sawtooth', .06),
  rot: () => beep(300, .12, 'triangle', .05, 120),
  door: () => beep(200, .4, 'square', .04, -120),
  drink: () => { beep(400, .15, 'sine', .08, 300); },
  heart: () => { beep(60, .1, 'sine', .15); setTimeout(() => beep(55, .1, 'sine', .12), 160); },
  gas: () => beep(900, .35, 'sawtooth', .03, -700),
};

// ===== 상태 =====
let S;
const ITEMS = {
  memo: { icon: '📝', name: '박사님의 메모', use: () => readText('📝 박사님의 메모', '<p style="font-size:18px">"보관실 약품병은 반드시, 비가 그친 뒤 하늘에 걸리는 <b>다리의 순서</b>대로 정리할 것!"</p><p style="text-align:right">— 박사</p>') },
  card: { icon: '💳', name: '카드키', use: () => say('보관실 문을 여는 카드키다. 문을 클릭하면 사용된다.') },
  scaleNote: { icon: '⚖️', name: '저울 숫자', use: () => readText('⚖️ 저울 숫자', '<p>저울이 균형을 이루자 바늘이 가리킨 숫자:</p><p style="font-size:36px;text-align:center;color:var(--glow)">3 7</p>') },
  antidote: { icon: '💉', name: '해독제', use: drinkAntidote },
  slide: { icon: '🧫', name: '보라 용액 슬라이드', use: () => say('보라 용액을 한 방울 떨어뜨린 유리 슬라이드다. 현미경으로 볼 수 있을 것 같다.') },
  micNote: { icon: '🔬', name: '현미경 메모', use: () => readText('🔬 현미경 메모', '<p>현미경 속에서 본 글자를 그대로 따라 그렸다:</p><div style="display:flex;justify-content:center"><div style="display:flex;gap:24px;transform:rotate(180deg);font-size:40px;font-family:serif;color:var(--purple)"><span>F</span><span>B</span></div></div>') },
  diary: { icon: '📔', name: '박사님의 일기장', use: showDiary },
};

function newGame() {
  S = {
    mode: 'play', room: 0, r: 0, px: 2.5, py: 6.5, time: MAX_TIME,
    bag: [], flags: {}, hints: [null, null, null], antidotes: 0, hintsUsed: 0,
    fade: 1, rooms: [room1(), room2(), room3()], heartT: 0,
  };
  enterRoom(0, true);
  renderBag();
}

// ===== 방 만들기 =====
function walls(o, skip = []) {
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
    if (i > 0 && i < N - 1 && j > 0 && j < N - 1) continue;
    if (skip.some(([x, y]) => x === i && y === j)) continue;
    o.push({ kind: 'tall', look: 'wall', x: i, y: j, w: 1, h: 1, H: WALL_H, solid: true, name: '벽', use: () => say('차갑고 단단한 실험실 벽이다.') });
  }
}
const tall = (look, x, y, w, h, H, name, use) => ({ kind: 'tall', look, x, y, w, h, H, solid: true, name, use });
const flat = (look, x, y, name, use, extra = {}) => ({ kind: 'flat', look, x, y, w: 1, h: 1, name, use, ...extra });
const decal = (look, x, y, w, h, face, name, use) => ({ kind: 'decal', look, x, y, w, h, face, name, use });
const door = (x, y, name, use, extra = {}) => ({ kind: 'tall', look: 'door', x, y, w: 1, h: 1, H: WALL_H, solid: true, name, use, ...extra });

function pickup(o, itemId, text) {
  removeObj(o); addItem(itemId); sfx.pick(); say(text);
}

function room1() {
  const o = [];
  walls(o, [[9, 5]]);
  o.push(door(9, 5, '보관실 문', function () {
    if (S.flags.r1door) { goRoom(1); return; }
    if (has('card')) { removeItem('card'); S.flags.r1door = true; sfx.door(); say('카드키를 꽂자 "삐빅!" 문이 열렸다. 한 번 더 클릭하면 다음 방으로 간다.'); }
    else { sfx.bad(); say('문이 잠겨 있다. 카드키를 꽂는 곳이 있다.'); }
  }, { openFlag: 'r1door' }));
  o.push(tall('cabinet', 3, 2, 2, 1, 1.0, '커다란 약품장', () => say('커다란 약품장이다. 무거워서 움직일 수 없다. 뒤쪽은 이 방향에서는 보이지 않는다…')));
  o.push(tall('lockshelf', 6, 1, 2, 1, 0.85, '자물쇠 선반', useLockShelf));
  o.push(tall('table', 1, 3, 1, 2, 0.45, '작업대', () => say('낡은 작업대다. 박사님이 급하게 쓴 듯한 실험 기록이 흩어져 있다. 쓸 만한 건 없다.')));
  o.push(flat('vial', 3, 7, '깨진 시험관', () => say('내가 깨트린 시험관이다… 초록색 독가스가 계속 피어오르고 있다. 서둘러야 한다!')));
  o.push(flat('memo', 4, 6, '바닥의 메모', function () { pickup(this, 'memo', '바닥에 떨어진 박사님의 메모를 주웠다. (가방에서 읽을 수 있다)'); }));
  o.push(flat('bottle', 7, 4, '빨간 약품병', () => say('🔴 <b>빨간</b> 약품병이다. 라벨에 <b>5g</b>이라고 적혀 있다.'), { color: '#ff3b4e' }));
  o.push(flat('bottle', 6, 6, '노란 약품병', () => say('🟡 <b>노란</b> 약품병이다. 라벨에 <b>11g</b>이라고 적혀 있다.'), { color: '#ffd23b' }));
  o.push(flat('bottle', 8, 3, '파란 약품병', () => say('🔵 <b>파란</b> 약품병이다. 라벨에 <b>8g</b>이라고 적혀 있다.'), { color: '#3b8bff' }));
  o.push(flat('bottle', 3, 1, '초록 약품병', () => say('🟢 약품장 뒤에 숨어 있던 <b>초록</b> 약품병이다! 라벨에 <b>13g</b>이라고 적혀 있다.'), { color: '#3bff6e' }));
  o.push(flat('bottle', 8, 8, '주황 약품병', () => say('🟠 구석에 숨어 있던 <b>주황</b> 약품병이다! 라벨에 <b>6g</b>이라고 적혀 있다.'), { color: '#ff8a2b' }));
  o.push(flat('antidote', 4, 1, '해독제', function () { pickup(this, 'antidote', '💉 해독제를 찾았다! 가방에서 클릭하면 마실 수 있다.'); }));
  return { name: '🧪 약품 보관실', start: [2.5, 6.5], tint: '#0d1f22', objs: o,
    intro: '쨍그랑! 박사님의 심부름으로 도구를 가지러 왔다가 독이 든 시험관을 깨트렸다. 문은 잠겼고 독가스가 퍼지고 있다… 탈출해야 한다!' };
}

function room2() {
  const o = [];
  walls(o, [[0, 5], [9, 5]]);
  o.push(door(0, 5, '들어온 문', () => say('들어온 문은 등 뒤에서 굳게 잠겨 버렸다.'), { openFlag: 'never' }));
  o.push(door(9, 5, '번호 자물쇠 문', function () {
    if (S.flags.r2door) { goRoom(2); return; }
    keypad('🔢 문 자물쇠', '두 자리 숫자를 입력하세요.', 2, '95', () => { S.flags.r2door = true; sfx.door(); say('"딸깍!" 문이 열렸다. 한 번 더 클릭하면 다음 방으로 간다.'); });
  }, { openFlag: 'r2door' }));
  o.push(decal('board', 4, 0, 2, 1, [0, 1], '칠판', () => readText('칠판', '<p>박사님의 글씨로 적혀 있다.</p><p style="font-size:18px">"오늘의 실험 — 비커 용액을 3번 부어 이 색을 만들 것"</p><div style="display:flex;justify-content:center"><div style="width:70px;height:70px;border-radius:50%;background:#4b2fb0;box-shadow:0 0 20px #4b2fb0"></div></div><p style="color:var(--dim);text-align:center">비슷한 색이 많으니 잘 비교할 것!</p>')));
  o.push(decal('poster', 4, 9, 3, 1, [0, -1], '주기율표 포스터', showPeriodic));
  o.push(tall('bench', 4, 4, 2, 2, 0.5, '실험대', useMixBench));
  o.push(tall('microscope', 7, 2, 1, 1, 0.75, '현미경', useMicroscope));
  o.push(tall('fridge', 2, 7, 1, 1, 1.0, '약품 냉장고', () => say('윙윙 소리를 내는 약품 냉장고다. 뒤쪽 벽 사이에 틈이 있는 것 같다…')));
  o.push(tall('table', 1, 1, 2, 1, 0.45, '선반', () => say('빈 비커들이 놓여 있다.')));
  o.push(flat('antidote', 2, 8, '해독제', function () { pickup(this, 'antidote', '💉 냉장고 뒤에서 해독제를 찾았다!'); }));
  return { name: '🔬 실험실', start: [1.5, 5.5], tint: '#160f24', objs: o,
    intro: '두 번째 방, 실험실이다. 보글보글 끓는 비커와 현미경이 보인다.' };
}

function room3() {
  const o = [];
  walls(o, [[0, 5], [9, 3]]);
  o.push(door(0, 5, '들어온 문', () => say('들어온 문은 다시 잠겨 버렸다.'), { openFlag: 'never' }));
  o.push(door(9, 3, '출구', function () {
    if (S.flags.exitOpen) { win(); return; }
    sfx.bad(); say('출구다! 하지만 컴퓨터로 잠금을 풀어야 열리는 것 같다.');
  }, { openFlag: 'exitOpen', exit: true }));
  o.push(tall('bookshelf', 5, 2, 2, 1, 1.0, '책장', () => say('어려운 과학책이 빽빽하다. 책장 뒤로 뭔가 떨어진 것 같은데, 이 방향에서는 안 보인다.')));
  o.push(tall('desk', 6, 6, 2, 1, 0.6, '컴퓨터', useComputer));
  o.push(tall('table', 1, 1, 2, 1, 0.45, '소파 탁자', () => say('식은 커피잔이 놓여 있다. 박사님은 밤새 연구한 모양이다.')));
  o.push(decal('whiteboard', 9, 6, 1, 2, [-1, 0], '화이트보드', () => readText('화이트보드', '<p style="font-size:17px">해독제 연구<br>· 재료 1 ✔<br>· 재료 2 ✔<br>· 마지막 재료: <b style="color:var(--purple)">보라 용액</b> ???</p>')));
  o.push(flat('diary', 5, 1, '일기장', function () { pickup(this, 'diary', '📔 책장 뒤에서 박사님의 일기장을 찾았다! (가방에서 읽을 수 있다)'); S.flags.diary = true; }));
  return { name: '🖥️ 박사님의 연구실', start: [1.5, 5.5], tint: '#0b1428', objs: o,
    intro: '마지막 방, 박사님의 연구실이다. 저 앞에 출구가 보인다!' };
}

function curRoom() { return S.rooms[S.room]; }
function removeObj(o) { const a = curRoom().objs; a.splice(a.indexOf(o), 1); }

function enterRoom(i, first) {
  S.room = i; S.r = 0; S.fade = 1;
  const R = curRoom();
  [S.px, S.py] = R.start;
  $('roomName').textContent = R.name;
  updateHintBtn();
  say(R.intro);
  if (!first) sfx.door();
}
function goRoom(i) { enterRoom(i); }

// ===== 가방 =====
function has(id) { return S.bag.includes(id); }
function addItem(id) { S.bag.push(id); renderBag(); }
function removeItem(id) { const k = S.bag.indexOf(id); if (k >= 0) S.bag.splice(k, 1); renderBag(); }
function renderBag() {
  const b = $('bag'); b.innerHTML = '';
  for (let i = 0; i < 7; i++) {
    const d = document.createElement('div'); d.className = 'slot';
    const id = S && S.bag[i];
    if (id) {
      d.classList.add('has'); d.innerHTML = ITEMS[id].icon + '<small>' + ITEMS[id].name + '</small>';
      d.onclick = () => { if (S.mode === 'play') ITEMS[id].use(); };
    }
    b.appendChild(d);
  }
}
function drinkAntidote() {
  removeItem('antidote');
  S.time = Math.min(MAX_TIME, S.time + ANTIDOTE_TIME);
  S.antidotes++;
  sfx.drink();
  say('💉 해독제를 마셨다! 몸이 한결 가벼워졌다. (+2분)');
}

function say(html) { $('msg').innerHTML = html; }
function openModal(html, onClose) {
  $('modalCard').innerHTML = html;
  $('modal').classList.add('show');
  S.modalClose = onClose || null;
  S.modalKey = null;
}
function closeModal() {
  $('modal').classList.remove('show');
  S.modalKey = null;
  const f = S.modalClose; S.modalClose = null; if (f) f();
}
function readText(title, body) {
  openModal(`<h2>${title}</h2>${body}<div class="row"><button class="big" onclick="closeModal()">닫기</button></div>`);
}
function penalty(sec, text) {
  S.time = Math.max(0, S.time - sec);
  sfx.gas(); S.puff = 1;
  say(text + ` <span style="color:var(--danger)">(-${sec}초)</span>`);
}

const WEIGHTS = [['#ff3b4e', 5, '빨간 병'], ['#3b8bff', 8, '파란 병'], ['#ffd23b', 11, '노란 병'], ['#3bff6e', 13, '초록 병'], ['#ff8a2b', 6, '주황 병']];
function showScale() {
  let on = new Set();
  const draw = () => {
    const left = 24, right = [...on].reduce((s, i) => s + WEIGHTS[i][1], 0);
    const a = Math.max(-16, Math.min(16, (right - left) * 1.5)) * Math.PI / 180;
    const cx = 150, cy = 46, L = 105;
    const lx = cx - L * Math.cos(a), ly = cy - L * Math.sin(a), rx = cx + L * Math.cos(a), ry = cy + L * Math.sin(a);
    const balanced = right === left && on.size === 3;
    const svg = `<svg viewBox="0 0 300 175" width="100%" style="max-width:320px;display:block;margin:auto">
      <rect x="140" y="${cy}" width="20" height="110" fill="#2a3a55"/><rect x="100" y="155" width="100" height="12" rx="4" fill="#2a3a55"/>
      <line x1="${lx}" y1="${ly}" x2="${rx}" y2="${ry}" stroke="#9fb3cf" stroke-width="6" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="7" fill="${balanced ? '#3cf0c8' : '#9fb3cf'}"/>
      <line x1="${lx}" y1="${ly}" x2="${lx}" y2="${ly + 50}" stroke="#6b7f9e"/><line x1="${rx}" y1="${ry}" x2="${rx}" y2="${ry + 50}" stroke="#6b7f9e"/>
      <ellipse cx="${lx}" cy="${ly + 52}" rx="40" ry="8" fill="#55688a"/><ellipse cx="${rx}" cy="${ry + 52}" rx="40" ry="8" fill="#55688a"/>
      <rect x="${lx - 16}" y="${ly + 26}" width="32" height="22" rx="3" fill="#8592a8"/><text x="${lx}" y="${ly + 42}" text-anchor="middle" font-size="12" fill="#111" font-weight="bold">24g</text>
      ${[...on].map((i, k) => `<rect x="${rx - 30 + k * 14}" y="${ry + 30}" width="10" height="18" rx="3" fill="${WEIGHTS[i][0]}"/>`).join('')}
    </svg>`;
    openModal(`<h2>⚖️ 선반 속 저울</h2>
      <p>왼쪽 접시에는 <b>24g</b> 추가 놓여 있다. 오른쪽 접시에 약품병을 <b>딱 3개</b> 올려 균형을 맞추면 뭔가 일어날 것 같다. 병마다 무게가 다른데, 무게 라벨은 방 안의 약품병에 붙어 있다.</p>
      ${svg}
      <p style="text-align:center">오른쪽 접시: 약품병 ${on.size} / 3개</p>
      <div class="row">${WEIGHTS.map((w, i) => `<button onclick="scaleToggle(${i})" style="border-color:${on.has(i) ? w[0] : 'var(--line)'}"><span style="color:${w[0]}">●</span> ${w[2]} ${on.has(i) ? '✓' : ''}</button>`).join('')}</div>
      <div class="row"><button onclick="closeModal()">닫기</button></div>`);
    if (balanced) {
      setTimeout(() => {
        S.flags.scaleDone = true; sfx.ok();
        addItem('scaleNote'); addItem('card');
        openModal(`<h2>⚖️ 균형!</h2><p>저울이 딱 균형을 이루자 눈금 바늘이 멈추며 숫자를 가리켰다.</p>
          <p style="font-size:44px;text-align:center;color:var(--glow);text-shadow:0 0 12px var(--glow)">3 7</p>
          <p>"딸깍" 하고 저울 아래 작은 서랍이 열렸다. 안에 <b>💳 카드키</b>가 있다!</p>
          <p style="color:var(--dim)">(숫자와 카드키를 가방에 넣었다)</p>
          <div class="row"><button class="big" onclick="closeModal()">좋아!</button></div>`);
        say('저울의 숫자 <b>37</b>을 기억하자. 카드키로 문을 열 수 있을 것 같다.');
      }, 500);
    }
  };
  window.scaleToggle = i => { if (on.has(i)) on.delete(i); else if (on.size < 3) on.add(i); else return; beep(300 + i * 60, .05); draw(); };
  draw();
}

// ===== 숫자 키패드 =====
function keypad(title, desc, len, answer, onOk) {
  let val = '';
  const draw = () => {
    openModal(`<h2>${title}</h2>${desc.startsWith('<') ? desc : '<p>' + desc + '</p>'}
      <div class="codebox">${Array.from({ length: len }, (_, i) => `<div>${val[i] || ''}</div>`).join('')}</div>
      <div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="kpPress('${n}')">${n}</button>`).join('')}
        <button onclick="kpBack()">←</button><button onclick="kpPress('0')">0</button><button onclick="kpOk()" style="border-color:var(--glow)">✓</button></div>
      <div class="row"><button onclick="closeModal()">닫기</button></div>`);
    S.modalKey = k => { if (/^[0-9]$/.test(k)) kpPress(k); else if (k === 'Backspace') kpBack(); else if (k === 'Enter') kpOk(); };
  };
  window.kpPress = d => { if (val.length < len) { val += d; beep(700, .05); draw(); } };
  window.kpBack = () => { val = val.slice(0, -1); draw(); };
  window.kpOk = () => {
    if (val.length < len) return;
    if (val === answer) { closeModal(); sfx.ok(); onOk(); }
    else {
      $('modalCard').classList.remove('shake'); void $('modalCard').offsetWidth; $('modalCard').classList.add('shake');
      sfx.bad(); val = '';
      S.time = Math.max(0, S.time - 20); S.puff = 1;
      say('삐빅! 틀린 번호다. 경고 장치에서 가스가 뿜어져 나왔다. <span style="color:var(--danger)">(-20초)</span>');
      setTimeout(draw, 350);
    }
  };
  draw();
}

function hintText() {
  const f = S.flags;
  if (S.room === 0) {
    if (!f.lockOpen) return '비가 그친 뒤 하늘에 걸리는 다리는 <b>무지개</b>야. 방 안 약품병 <b>5개</b>의 색을 모두 찾아야 해. 가구 뒤나 벽 구석에 숨은 병은 <b>&lt; &gt; 로 방을 돌려야</b> 보여!';
    if (!f.scaleDone) return '방 안의 약품병을 클릭하면 라벨에 <b>무게</b>가 적혀 있어. 세 병의 무게 합이 <b>24g</b>이 되게 골라 봐.';
    return '카드키를 얻었어! 오른쪽 벽의 문을 클릭해서 다음 방으로 가자.';
  }
  if (S.room === 1) {
    if (!f.mixDone) return '칠판의 색은 아주 진한 <b>남보라</b>야. 보라는 빨강 + 파랑이지? 파란 느낌이 더 강하려면 어느 쪽을 더 넣어야 할까?';
    if (!f.micSeen) return '보라 용액 슬라이드를 얻었어. <b>현미경</b>을 클릭해서 들여다보자.';
    if (!f.r2door) return '현미경은 상이 <b>위아래·좌우 모두 뒤집혀</b> 보여. 글자를 통째로 뒤집어서 읽으면 <b>원소 기호</b>가 돼. 주기율표 포스터는 아래쪽 벽에 있으니 방을 두 번 돌려 봐!';
    return '문이 열렸어. 다음 방으로!';
  }
  if (!f.diary) return '박사님의 일기장이 <b>책장 뒤</b>에 떨어져 있어. &lt; &gt; 로 방을 옆으로 돌려 봐.';
  if (!f.exitOpen) return '"무거운 것"은 <b>저울</b>, "작은 알갱이"는 <b>원소</b>야. 비밀번호 = 저울의 숫자(앞 2자리) + 원소의 숫자(뒤 2자리).';

  if (!S) return;
  if (S.mode === 'play') {
    S.mode = 'pause';
    openModal(`<h2>⏸ 일시정지</h2><p>독가스도 잠시 멈췄어요.</p><div class="row"><button class="big" onclick="closeModal()">계속하기</button><button onclick="closeModal();newGame();">처음부터</button></div>`, () => { if (S.mode === 'pause') S.mode = 'play'; });
  } else if (S.mode === 'pause') closeModal();
}

// ===== 끝 =====
function fmt(t) { t = Math.max(0, Math.ceil(t)); return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function getBest() { try { return +localStorage.getItem('labEscapeBest15') || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('labEscapeBest15', v); } catch (e) {} }
function win() {
  S.mode = 'end'; sfx.ok(); setTimeout(sfx.ok, 400);
  const best = getBest(), isBest = S.time > best;
  if (isBest) setBest(Math.ceil(S.time));
  openModal(`<h2>🎉 탈출 성공!</h2>
    <p>출구 문을 열고 나오자 박사님이 깜짝 놀란 얼굴로 서 있었다.</p>
    <p>손에 든 보라 용액을 본 박사님이 외쳤다.<br><b style="font-size:18px;color:var(--glow)">"네가 해독제를 완성했구나!"</b></p>
    <p>내가 만든 보라 용액이 바로 해독제의 <b>마지막 재료</b>였던 것이다. 실수로 시작된 위기가, 박사님의 연구를 완성시켰다! 🧪✨</p>
    <div class="stat"><span>남은 시간</span><b>${fmt(S.time)} ${isBest ? '🏆 최고 기록!' : ''}</b></div>
    <div class="stat"><span>찾은 해독제</span><b>${S.antidotes + S.bag.filter(i => i === 'antidote').length} / 2</b></div>
    <div class="stat"><span>쓴 힌트</span><b>${S.hintsUsed} / 3</b></div>
    <div class="row"><button class="big" onclick="closeModal()">다시 하기</button></div>`, newGame);
}
function lose() {
  S.mode = 'end'; sfx.bad();
  openModal(`<h2 style="color:var(--danger)">☠️ 쓰러졌다…</h2>
    <p>독가스가 실험실을 가득 채웠다. 눈앞이 초록빛으로 흐려지며 정신을 잃고 말았다…</p>
    <p style="color:var(--dim)">팁: 해독제는 각 방의 가구 뒤에 숨어 있어요. &lt; &gt; 로 방을 돌려 보세요!</p>
    <div class="row"><button class="big" onclick="closeModal()">다시 도전</button></div>`, newGame);
}

// ===== 시작 화면 =====
function startScreen() {
  const best = getBest();
  S = { mode: 'start', room: 0, r: 0, px: 2.5, py: 6.5, time: MAX_TIME, bag: [], flags: {}, hints: [null, null, null], fade: 0, rooms: [room1(), room2(), room3()] };
  renderBag();
  openModal(`<h2>🧪 비밀 실험실 탈출</h2>
    <p>나는 천재 박사님의 조수. 박사님의 명령으로 실험 도구를 가지러 왔다가… <b style="color:var(--danger)">독이 든 시험관을 깨트리고 말았다!</b></p>
    <p>문은 잠겨 있고 초록색 독가스가 퍼지고 있다. <b>15분</b> 안에 방 3개를 지나 실험실을 탈출하자!</p>
    <div class="hint" style="font-size:14px;line-height:1.7">
      ⌨️ <b>WASD</b> 이동<br>🖱️ 물건 <b>클릭</b>으로 조사 (가까이 가야 해요)<br>🔄 <b>&lt; &gt;</b> 방 돌리기 — 가구 뒤에 숨은 것을 찾아요<br>💉 해독제를 마시면 +2분 · 💡 힌트는 방마다 1번
    </div>
    ${best ? `<p style="text-align:center;color:var(--dim)">🏆 최고 기록: ${fmt(best)} 남기고 탈출</p>` : ''}
    <div class="row"><button class="big" onclick="closeModal()">시작하기</button></div>`, () => { if (S.mode === 'start') newGame(); });
}

// ===== 루프 =====
let last = performance.now(), lastBlur = -1;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; now = t / 1000;
  if (S.mode === 'play') {
    const modalOpen = $('modal').classList.contains('show');
    if (!modalOpen) move(dt);
    S.time -= dt;
    if (S.time <= 120) { S.heartT -= dt; if (S.heartT <= 0) { sfx.heart(); S.heartT = 1 - (120 - S.time) / 240; } }
    if (S.time <= 0) { S.time = 0; lose(); }
  }
  if (S.fade > 0) S.fade = Math.max(0, S.fade - dt * 2.5);
  if (S.puff > 0) S.puff = Math.max(0, S.puff - dt * 1.5);
  for (const f of fog) { f.x += f.vx * dt; f.y += f.vy * dt; if (f.x < -100 || f.x > CW + 100) f.vx *= -1; if (f.y < -100 || f.y > CH + 100) f.vy *= -1; }

  const ratio = S.time / MAX_TIME;
  $('gaugeFill').style.width = (ratio * 100) + '%';
  $('gaugeFill').style.background = ratio > .5 ? 'linear-gradient(90deg,#2bd17e,#8cf06a)' : ratio > .2 ? 'linear-gradient(90deg,#d1b02b,#f0d86a)' : 'linear-gradient(90deg,#d12b45,#f06a7a)';
  $('gauge').classList.toggle('low', ratio <= .1 && S.mode === 'play');
  $('timeText').textContent = '버틸 수 있는 시간 ' + fmt(S.time);
  const blur = Math.round((1 - ratio) * 16) / 10;
  if (blur !== lastBlur) { cv.style.filter = `blur(${blur}px) saturate(${1 + (1 - ratio) * .3})`; lastBlur = blur; }

  draw();
  requestAnimationFrame(loop);
}
startScreen();
requestAnimationFrame(loop);
</script>
</body>
