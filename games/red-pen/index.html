<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세종대왕의 빨간펜</title>
  <!-- 제출용: style.css와 script.js를 이 파일 하나에 그대로 옮겨 합쳤다 -->
  <!-- 아래 <style> 안은 style.css, 맨 아래 <script> 안은 script.js와 똑같다 -->
  <style>
/* ============================================================
   세종대왕의 빨간펜 - 꾸미기
   한지 빛깔 바탕 + 먹색 글씨 + 빨간펜 빨강
   초등학생이 읽기 쉽게 글씨를 크게 했다.
   ============================================================ */


/* 자주 쓰는 색을 이름 붙여 한곳에 모아 둔다 */
:root {
  --한지색: #fbf3e2;   /* 옛날 종이 같은 바탕색 */
  --먹색: #262220;     /* 붓글씨 같은 진한 글씨색 */
  --빨간펜: #d22630;   /* 틀린 것을 표시하는 빨강 */
  --초록: #1f7a4d;     /* 맞은 것을 표시하는 초록 */
  --남색: #1b3f73;     /* 제목과 버튼에 쓰는 파랑 */
}

/* 모든 요소의 크기를 테두리까지 포함해서 재도록 맞춘다 */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background-color: var(--한지색);
  color: var(--먹색);
  font-family: "맑은 고딕", "Malgun Gothic", sans-serif;
  font-size: 20px;       /* 기본 글씨부터 크게 */
  line-height: 1.7;
}

/* hidden이 붙은 부분은 무조건 감춘다 */
[hidden] {
  display: none !important;
}


/* ---------- 맨 위 제목 ---------- */
header {
  text-align: center;
  margin-bottom: 30px;
}

h1 {
  font-size: 44px;
  color: var(--남색);
  margin: 10px 0;
  /* 제목 아래에 빨간펜으로 밑줄을 그은 느낌 */
  border-bottom: 5px solid var(--빨간펜);
  display: inline-block;
  padding-bottom: 6px;
}

.부제목 {
  font-size: 20px;
  margin: 10px 0 0;
}


/* ---------- 가운데 내용 상자 ---------- */
main {
  max-width: 760px;
  margin: 0 auto;
  background-color: #fffdf7;
  border: 3px solid var(--남색);
  border-radius: 16px;
  padding: 30px;
}

h2 {
  font-size: 32px;
  margin-top: 0;
}

.안내글 {
  font-size: 24px;
  text-align: center;
}


/* ---------- 문제 ---------- */
.진행상황 {
  font-size: 20px;
  font-weight: bold;
  color: var(--남색);
  margin: 0;
}

.종류표시 {
  font-size: 18px;
  margin: 4px 0 16px;
}

.질문 {
  font-size: 34px;
  text-align: center;
  margin: 10px 0 24px;
}


/* ---------- 보기 버튼 4개 ---------- */
.보기상자 {
  display: grid;
  grid-template-columns: 1fr 1fr;  /* 두 칸씩 두 줄로 늘어놓는다 */
  gap: 16px;
}

.보기버튼 {
  font-family: inherit;
  font-size: 30px;
  font-weight: bold;
  padding: 22px 10px;
  cursor: pointer;
  background-color: #ffffff;
  color: var(--먹색);
  border: 3px solid var(--남색);
  border-radius: 12px;
}

/* 마우스를 올리거나 키보드로 옮겨 왔을 때 잘 보이게 한다 */
.보기버튼:hover:enabled {
  background-color: #e8f0fb;
}

.보기버튼:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}

/* 정답 버튼: 초록 테두리 + 앞에 O 기호 (색만으로 알려 주지 않기) */
.보기버튼.정답표시 {
  border-color: var(--초록);
  background-color: #e6f5ec;
  color: var(--초록);
}

.보기버튼.정답표시::before {
  content: "O ";
}

/* 내가 고른 틀린 답: 빨간펜으로 찍찍 그은 느낌 */
.보기버튼.빨간펜표시 {
  border-color: var(--빨간펜);
  background-color: #fdeaeb;
  color: var(--빨간펜);
  text-decoration: line-through;
  text-decoration-color: var(--빨간펜);
  text-decoration-thickness: 4px;
}

.보기버튼.빨간펜표시::before {
  content: "X ";
}

/* 채점이 끝나 잠긴 버튼은 흐리게 */
.보기버튼:disabled {
  cursor: default;
  opacity: 0.85;
}


/* ---------- 채점 결과와 이유 ---------- */
.채점결과 {
  margin-top: 24px;
  padding: 18px 22px;
  border-radius: 12px;
  border-left: 10px solid var(--남색);
  background-color: #f6f2e7;
}

.채점결과.맞음 {
  border-left-color: var(--초록);
}

.채점결과.틀림 {
  border-left-color: var(--빨간펜);
}

.판정 {
  font-size: 30px;
  font-weight: bold;
  margin: 0 0 8px;
}

.채점결과.맞음 .판정 {
  color: var(--초록);
}

.채점결과.틀림 .판정 {
  color: var(--빨간펜);
}

.정답줄 {
  font-size: 26px;
  margin: 6px 0;
}

.이유줄 {
  font-size: 22px;
  margin: 6px 0 0;
}


/* ---------- 큰 버튼 (시작, 다음, 다시 풀기) ---------- */
.큰버튼 {
  display: block;
  margin: 26px auto 0;
  font-family: inherit;
  font-size: 26px;
  font-weight: bold;
  padding: 16px 34px;
  cursor: pointer;
  color: #ffffff;
  background-color: var(--남색);
  border: none;
  border-radius: 12px;
}

.큰버튼:hover {
  background-color: #2a5697;
}

.큰버튼:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}


/* 작은 버튼 ('처음으로'처럼 덜 중요한 버튼) */
.작은버튼 {
  font-size: 20px;
  padding: 10px 22px;
  color: var(--남색);
  background-color: #ffffff;
  border: 3px solid var(--남색);
}

.작은버튼:hover {
  background-color: #e8f0fb;
}


/* ---------- 받아쓰기 ---------- */

/* 따라 써야 할 문장 (원고지에 적힌 느낌) */
.보기문장 {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  padding: 22px 16px;
  margin: 10px 0 22px;
  background-color: #f6f2e7;
  border: 3px dashed var(--남색);
  border-radius: 12px;
}

.입력설명 {
  display: block;
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 8px;
}

.받아쓰기입력 {
  width: 100%;
  font-family: inherit;
  font-size: 28px;
  padding: 14px;
  color: var(--먹색);
  background-color: #ffffff;
  border: 3px solid var(--남색);
  border-radius: 12px;
}

.받아쓰기입력:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}

/* 채점이 끝나 잠긴 입력칸 */
.받아쓰기입력:disabled {
  background-color: #f2f0ea;
}

.글자줄라벨 {
  font-size: 18px;
  font-weight: bold;
  margin: 10px 0 4px;
}

/* 내가 쓴 글자를 한 글자씩 늘어놓는 줄 */
.글자줄 {
  font-size: 30px;
  font-weight: bold;
  margin: 0 0 12px;
  white-space: pre-wrap;   /* 띄어쓰기가 그대로 보이게 한다 */
  word-break: break-all;
}

/* 잘못 쓴 글자: 빨간펜으로 찍 그은 느낌 */
.글자.더씀 {
  color: var(--빨간펜);
  text-decoration: line-through;
  text-decoration-thickness: 4px;
  background-color: #fdeaeb;
}

/* 빠뜨린 글자: 빨간펜으로 끼워 넣어 준 느낌 */
.글자.빠짐 {
  color: var(--빨간펜);
  border-bottom: 4px solid var(--빨간펜);
  background-color: #fdeaeb;
}


/* ---------- 3단계: 진짜 받아쓰기 ---------- */

/* 보여 줄 시간 고르기 (동그라미 단추 3개) */
.시간고르기 {
  border: 3px solid var(--남색);
  border-radius: 12px;
  padding: 16px 22px;
  margin: 0 0 16px;
}

.시간고르기 legend {
  font-size: 24px;
  font-weight: bold;
  padding: 0 8px;
}

.시간고르기 label {
  display: block;
  font-size: 26px;
  padding: 8px 0;
  cursor: pointer;
}

.시간고르기 input {
  width: 26px;
  height: 26px;
  margin-right: 10px;
  vertical-align: middle;
}

.시간고르기 input:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}

/* 남은 시간: 숫자 + 막대기 */
.남은시간글 {
  font-size: 24px;
  font-weight: bold;
  margin: 0 0 6px;
}

.시간막대틀 {
  height: 22px;
  background-color: #e4ddcc;
  border: 2px solid var(--남색);
  border-radius: 11px;
  overflow: hidden;
}

.시간막대 {
  height: 100%;
  width: 100%;
  background-color: var(--남색);
}

/* 가려진 문장: 먹으로 덮은 느낌 */
.보기문장.가려짐 {
  color: #8a8175;
  background-color: #e4ddcc;
  border-style: solid;
  font-weight: normal;
}

/* 한 번 더 보기 버튼은 가운데에 둔다 */
#다시보기버튼 {
  display: block;
  margin: 0 auto 16px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  border-radius: 12px;
}

#다시보기버튼:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}

.알림글 {
  font-size: 20px;
  text-align: center;
  margin: 0 0 12px;
  min-height: 1em;
}

.다시보기줄 {
  font-size: 20px;
  margin: 10px 0 0;
  padding-top: 8px;
  border-top: 2px dashed #c9bfa8;
}


/* ---------- 4단계: 듣고 쓰기 ---------- */
.듣기상자 {
  text-align: center;
  margin: 0 0 16px;
}

.듣기상자 .큰버튼 {
  margin-top: 0;
}

#다시듣기버튼 {
  display: block;
  margin: 0 auto 8px;
  font-family: inherit;
  font-size: 24px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 12px;
}

#다시듣기버튼:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}


/* ---------- 5단계: 종류 고르기 ---------- */
.종류버튼상자 {
  display: grid;
  grid-template-columns: 1fr 1fr;   /* 두 칸씩 두 줄 */
  gap: 16px;
  margin-bottom: 10px;
}

.종류버튼 {
  font-family: inherit;
  font-size: 26px;
  font-weight: bold;
  padding: 20px 10px;
  cursor: pointer;
  color: #ffffff;
  background-color: var(--남색);
  border: none;
  border-radius: 12px;
}

.종류버튼:hover:enabled {
  background-color: #2a5697;
}

.종류버튼:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}

/* 문제가 0개라 누를 수 없는 버튼 */
.종류버튼:disabled {
  cursor: default;
  background-color: #b9b2a4;
}

.푼종류 {
  font-size: 24px;
  text-align: center;
  margin: 0;
}


/* ---------- 6단계: 내 기록 ---------- */
#내기록버튼 {
  display: block;
  margin: 22px auto 0;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  border-radius: 12px;
}

.기록목록 {
  font-size: 20px;
  padding-left: 1.6em;
  margin: 0 0 20px;
}

/* 기록 한 줄: 공책 줄처럼 아래에 점선 */
.기록목록 li {
  padding: 8px 0;
  border-bottom: 2px dashed #c9bfa8;
}

#기록지우기버튼 {
  border-color: var(--빨간펜);
  color: var(--빨간펜);
  margin-right: 10px;
}

#내기록버튼:focus,
#기록지우기버튼:focus,
.처음버튼:focus {
  outline: 4px solid #f2a71b;
  outline-offset: 3px;
}


/* ---------- 점수 ---------- */
.점수 {
  font-size: 40px;
  font-weight: bold;
  text-align: center;
  color: var(--빨간펜);
  margin: 20px 0;
}


/* ---------- 화면이 좁은 휴대폰에서는 보기를 한 줄에 하나씩 ---------- */
@media (max-width: 600px) {
  .보기상자,
  .종류버튼상자 {
    grid-template-columns: 1fr;
  }
  h1 {
    font-size: 32px;
  }
  .질문 {
    font-size: 26px;
  }
}
  </style>
</head>
<body>

  <header>
    <h1>세종대왕의 빨간펜</h1>
    <p class="부제목">헷갈리는 맞춤법을 퀴즈와 받아쓰기로 연습해요</p>
  </header>

  <main>

    <!-- 0. 고르기 화면: 퀴즈를 할지 받아쓰기를 할지 고른다 -->
    <section id="고르기화면">
      <p class="안내글">무엇을 해 볼까요?</p>
      <button id="퀴즈고르기버튼" class="큰버튼">맞춤법 퀴즈 풀기</button>
      <button id="받아쓰기고르기버튼" class="큰버튼">받아쓰기 하기</button>
      <button id="내기록버튼" class="작은버튼">내 기록</button>
    </section>

    <!-- 6. 내 기록 화면: 최근 기록 10개를 보여 준다 -->
    <section id="기록화면" hidden>
      <h2>내 기록</h2>
      <!-- 기록이 없거나 저장이 안 될 때 알려 주는 곳 -->
      <p id="기록안내" class="안내글"></p>
      <!-- 기록 목록은 script.js가 채워 넣는다 (최신 기록이 맨 위) -->
      <ol id="기록목록" class="기록목록" aria-label="최근 기록"></ol>
      <button id="기록지우기버튼" class="작은버튼">기록 지우기</button>
      <button class="처음버튼 작은버튼">처음으로</button>
    </section>

    <!-- 1. 퀴즈 시작 화면 -->
    <section id="시작화면" hidden>
      <p class="안내글">
        <!-- 문제 개수는 script.js가 세어서 채워 넣는다 -->
        문제는 모두 <strong id="문제수">?</strong>개예요.<br>
        네 개의 보기 중에서 <strong>바르게 쓴 말</strong>을 골라 보세요.
      </p>
      <p class="안내글">어떤 종류를 풀어 볼까요?</p>
      <!-- 종류 버튼 4개(전체/받침/쌍둥이/외우기)는 script.js가 문제 수를 세어서 만든다 -->
      <div id="종류버튼상자" class="종류버튼상자" role="group" aria-label="문제 종류 고르기"></div>
      <button class="처음버튼 작은버튼">처음으로</button>
    </section>

    <!-- 2. 퀴즈 문제 화면 -->
    <section id="문제화면" hidden>
      <p id="진행상황" class="진행상황"></p>
      <p id="종류표시" class="종류표시"></p>
      <h2 id="질문" class="질문"></h2>

      <!-- 보기 버튼 4개는 script.js가 여기에 만들어 넣는다 -->
      <div id="보기상자" class="보기상자" role="group" aria-label="답 고르기"></div>

      <!-- role="status"를 붙이면 화면 낭독기가 자동으로 읽어 준다 -->
      <div id="채점결과" class="채점결과" role="status" aria-live="polite" hidden></div>

      <button id="다음버튼" class="큰버튼" hidden>다음 문제</button>
    </section>

    <!-- 3. 퀴즈 점수 화면 -->
    <section id="결과화면" hidden>
      <h2>다 풀었어요!</h2>
      <!-- 어떤 종류를 풀었는지 보여 주는 곳 -->
      <p id="푼종류" class="푼종류"></p>
      <p id="점수" class="점수" role="status" aria-live="polite"></p>
      <p id="칭찬말" class="안내글"></p>
      <button id="다시버튼" class="큰버튼">다시 풀기</button>
      <button class="처음버튼 작은버튼">처음으로</button>
    </section>

    <!-- 4-1. 받아쓰기 준비 화면: 문장을 몇 초 보여 줄지 고른다 -->
    <section id="받아쓰기준비화면" hidden>
      <fieldset class="시간고르기">
        <legend>문장을 얼마나 보여 줄까요?</legend>
        <label><input type="radio" name="보기시간" value="3"> 3초</label>
        <label><input type="radio" name="보기시간" value="5" checked> 5초</label>
        <label><input type="radio" name="보기시간" value="0"> 계속 보기 (연습용)</label>
        <!-- 한국어 목소리가 있을 때만 script.js가 보여 준다 -->
        <label id="듣기고르기칸" hidden><input type="radio" name="보기시간" value="듣기"> 듣고 쓰기 (컴퓨터가 읽어 줘요)</label>
      </fieldset>
      <!-- 목소리를 찾는 중인지, 없는지 알려 주는 곳 -->
      <p id="목소리안내" class="종류표시" role="status" aria-live="polite"></p>

// ------------------------------------------------------------
function 배열섞기(배열) {
  for (let i = 배열.length - 1; i > 0; i--) {
    const 아무자리 = Math.floor(Math.random() * (i + 1));
    const 잠깐 = 배열[i];
    배열[i] = 배열[아무자리];
    배열[아무자리] = 잠깐;
  }
  return 배열;
}

  const 모든화면 = [고르기화면, 시작화면, 문제화면, 결과화면,
                    받아쓰기준비화면, 받아쓰기화면, 받아쓰기결과화면, 기록화면];
  for (const 화면 of 모든화면) {
    화면.hidden = (화면 !== 보여줄화면);
  }
}


// ============================================================
//  여기부터 [6]~[11]은 1단계에서 만든 4지선다 퀴즈
// ============================================================

// ------------------------------------------------------------
//  [6] 보기 4개를 만든다
//  정답 1개 + 그 낱말의 틀린말 + 다른 문제에서 빌려 온 틀린말로 4개를 채운다.
//  '쌍둥이' 낱말은 둘 다 맞는 말이라서 남의 보기로 빌려 오지 않는다.
// ------------------------------------------------------------
function 보기만들기(문제) {
  const 보기 = [문제.정답];

  // 이 문제에서 가장 헷갈리는 짝부터 보기에 넣는다
  for (const 틀린 of 문제.틀린말) {
    보기.push(틀린);
  }

  // 모자란 자리는 다른 문제의 '틀린말'로 채운다
  const 빌려올말 = [];
  for (const 낱말 of 낱말자료) {
    if (낱말 === 문제) continue;           // 자기 자신은 건너뛴다
    if (낱말.종류 === "쌍둥이") continue;  // 쌍둥이의 짝은 맞는 말이라 제외
    for (const 틀린 of 낱말.틀린말) {
      빌려올말.push(틀린);
    }
  }
  배열섞기(빌려올말);

  // 겹치지 않게 골라서 보기가 4개가 될 때까지 넣는다
  for (const 후보 of 빌려올말) {
    if (보기.length >= 4) break;
    if (!보기.includes(후보)) 보기.push(후보);
  }

  return 배열섞기(보기);
}


// ------------------------------------------------------------
//  [7] 문제 하나를 화면에 보여 준다
// ------------------------------------------------------------
function 문제보여주기() {
  const 문제 = 문제순서[현재번호];

  // 진행 상황과 문제 종류를 글자로 알려 준다
  진행상황.textContent = (현재번호 + 1) + "번 / 모두 " + 문제순서.length + "문제";
  종류표시.textContent = "[" + 문제.종류 + "] 문제";

  // 쌍둥이 낱말은 따로 적어 둔 질문을, 나머지는 같은 질문을 쓴다
  if (문제.질문) {
    질문칸.textContent = 문제.질문;
  } else {
    질문칸.textContent = "바르게 쓴 말은 무엇일까요?";
  }

  // 지난 문제의 흔적을 모두 지운다
  보기상자.innerHTML = "";
  채점결과.hidden = true;
  채점결과.textContent = "";
  다음버튼.hidden = true;

  // 보기 4개를 버튼으로 만들어 넣는다
  const 보기목록 = 보기만들기(문제);
  for (const 보기말 of 보기목록) {
    const 버튼 = document.createElement("button");
    버튼.className = "보기버튼";
    버튼.textContent = 보기말;
    버튼.setAttribute("aria-label", 보기라벨만들기(보기말));
    버튼.addEventListener("click", function () {
      답고르기(보기말, 문제);
    });
    보기상자.appendChild(버튼);
  }

  // 키보드만 쓰는 사람을 위해 첫 번째 보기에 커서를 옮겨 준다
  const 첫보기 = 보기상자.querySelector("button");
  if (첫보기) 첫보기.focus();
}


// 화면 낭독기가 읽을 보기 설명을 만든다
function 보기라벨만들기(보기말) {
  return "보기 " + 보기말 + ", 이것을 고르기";
}


// ------------------------------------------------------------
//  [8] 답을 골랐을 때 채점하고 이유를 보여 준다
// ------------------------------------------------------------
function 답고르기(고른말, 문제) {
  const 맞았다 = (고른말 === 문제.정답);
  if (맞았다) 맞힌개수++;

  // 보기 버튼을 모두 잠그고, 정답과 내가 고른 답에 표시를 남긴다
  const 버튼들 = 보기상자.querySelectorAll("button");
  for (const 버튼 of 버튼들) {
    버튼.disabled = true;
    if (버튼.textContent === 문제.정답) {
      버튼.classList.add("정답표시");          // 초록 + O 기호
    } else if (버튼.textContent === 고른말) {
      버튼.classList.add("빨간펜표시");        // 빨강 + X 기호 (빨간펜!)
    }
  }

  // 맞았는지 알려 주고 이유까지 보여 준다
  // (색만으로 알려 주지 않도록 O, X 글자도 함께 쓴다)
  채점결과.className = 맞았다 ? "채점결과 맞음" : "채점결과 틀림";
  채점결과.innerHTML =
    "<p class='판정'>" + (맞았다 ? "O 맞았어요!" : "X 틀렸어요") + "</p>" +
    "<p class='정답줄'>바른 말: <strong>" + 문제.정답 + "</strong></p>" +
    "<p class='이유줄'>왜? " + 문제.이유 + "</p>";
  채점결과.hidden = false;

  // 마지막 문제면 버튼 글자를 바꿔 준다
  다음버튼.textContent =
    (현재번호 === 문제순서.length - 1) ? "점수 보기" : "다음 문제";
  다음버튼.hidden = false;
  다음버튼.focus();
}


// ------------------------------------------------------------
//  [9] 다음 문제로 넘어가거나, 다 풀었으면 점수를 보여 준다
// ------------------------------------------------------------
function 다음문제() {
  현재번호++;
  if (현재번호 < 문제순서.length) {
    문제보여주기();
  } else {
    결과보여주기();
  }
}


// ------------------------------------------------------------
//  [10] 퀴즈 점수 화면
// ------------------------------------------------------------
function 결과보여주기() {
  화면보이기(결과화면);

  const 전체 = 문제순서.length;
  푼종류칸.textContent = "푼 종류: " + 이번퀴즈종류;
  점수칸.textContent = 전체 + "문제 중 " + 맞힌개수 + "문제 정답!";
  기록남기기("퀴즈", 이번퀴즈종류, 맞힌개수, 전체);   // 점수를 기록장에 적는다

  // 맞힌 개수에 따라 다른 말을 해 준다
  if (맞힌개수 === 전체) {
    칭찬말칸.textContent = "완벽해요! 세종대왕님도 깜짝 놀라셨어요.";
  } else if (맞힌개수 >= 전체 - 3) {
    칭찬말칸.textContent = "아주 잘했어요! 조금만 더 하면 완벽해요.";
  } else if (맞힌개수 >= 전체 / 2) {
    칭찬말칸.textContent = "좋아요! 틀린 낱말의 이유를 한 번 더 읽어 봐요.";
  } else {
    칭찬말칸.textContent = "괜찮아요. 다시 풀면 훨씬 잘할 수 있어요!";
  }

  다시버튼.focus();
}


// ------------------------------------------------------------
//  [11] 퀴즈를 처음부터 시작한다
//  낱말묶음을 주면 그 낱말로만 퀴즈를 낸다. (종류별 퀴즈, 틀린 낱말 퀴즈에 쓴다)
//  종류이름은 점수 화면에 '푼 종류'로 보여 준다.
// ------------------------------------------------------------
function 퀴즈시작(낱말묶음, 종류이름) {
  이번퀴즈목록 = 낱말묶음 ? 낱말묶음 : 낱말자료;
  이번퀴즈종류 = 종류이름 ? 종류이름 : "전체";
  if (이번퀴즈목록.length === 0) return;   // 문제가 없으면 시작하지 않는다

  문제순서 = 배열섞기(이번퀴즈목록.slice()); // 원래 자료는 두고 복사본을 섞는다
  현재번호 = 0;
  맞힌개수 = 0;

  화면보이기(문제화면);
  문제보여주기();
}


// ------------------------------------------------------------
//  [11-1] 종류 버튼 4개(전체/받침/쌍둥이/외우기)를 만든다
//  낱말자료에서 종류마다 몇 문제인지 세어서 버튼에 같이 적는다.
//  문제가 0개인 종류는 누를 수 없게 한다.
// ------------------------------------------------------------
function 종류버튼만들기() {
  종류버튼상자.innerHTML = "";
  const 종류들 = ["전체", "받침", "쌍둥이", "외우기"];

  for (const 종류 of 종류들) {
    // 이 종류에 해당하는 낱말만 골라 낸다
    const 고른낱말 = (종류 === "전체")
      ? 낱말자료.slice()
      : 낱말자료.filter(function (낱말) { return 낱말.종류 === 종류; });

    const 버튼 = document.createElement("button");
    버튼.className = "종류버튼";
    버튼.textContent = 종류 + " (" + 고른낱말.length + "문제)";
    버튼.setAttribute("aria-label", 종류 + " " + 고른낱말.length + "문제 풀기");
    버튼.disabled = (고른낱말.length === 0);
    버튼.addEventListener("click", function () {
      퀴즈시작(고른낱말, 종류);
    });
    종류버튼상자.appendChild(버튼);
  }
}


// ============================================================
//  여기부터 [12]~[17]은 2단계에서 만든 받아쓰기
// ============================================================

// ------------------------------------------------------------
//  [12] 띄어쓰기 정리
//  앞뒤의 빈칸을 없애고, 빈칸이 여러 번 이어지면 한 칸으로 줄인다.
//  (실수로 스페이스를 두 번 눌러도 틀리지 않게 하려고)
// ------------------------------------------------------------
function 띄어쓰기정리(글) {
  return 글.trim().replace(/\s+/g, " ");
}


// ------------------------------------------------------------
//  [13] 내가 쓴 답과 정답을 한 글자씩 맞춰 본다
//  글자 수가 달라도 되도록, 두 글의 '겹치는 글자'가 가장 많아지게 줄을 맞춘다.
//  결과는 { 글자, 상태 } 묶음들이고 상태는 세 가지다.
//    맞음 - 제대로 쓴 글자
//    더씀 - 내가 썼는데 정답에는 없는 글자
//    빠짐 - 정답에는 있는데 내가 빠뜨린 글자
// ------------------------------------------------------------
function 글자비교하기(내답, 정답) {
  const 나 = Array.from(내답);   // 글자 하나씩 쪼갠다
  const 답 = Array.from(정답);

  // 겹침표[i][j] = 나의 i번째부터, 답의 j번째부터 볼 때 겹치는 글자 수
  const 겹침표 = [];
  for (let i = 0; i <= 나.length; i++) {
    겹침표.push(new Array(답.length + 1).fill(0));
  }
  for (let i = 나.length - 1; i >= 0; i--) {
    for (let j = 답.length - 1; j >= 0; j--) {
      if (나[i] === 답[j]) {
        겹침표[i][j] = 겹침표[i + 1][j + 1] + 1;
      } else {
        겹침표[i][j] = Math.max(겹침표[i + 1][j], 겹침표[i][j + 1]);
      }
    }
  }

  // 표를 따라 앞에서부터 걸어가며 결과를 만든다
  const 결과 = [];
  let i = 0;
  let j = 0;
  while (i < 나.length && j < 답.length) {
    if (나[i] === 답[j]) {
      결과.push({ 글자: 나[i], 상태: "맞음" });
      i++;
      j++;
    } else if (겹침표[i + 1][j] >= 겹침표[i][j + 1]) {
      결과.push({ 글자: 나[i], 상태: "더씀" });
      i++;
    } else {
      결과.push({ 글자: 답[j], 상태: "빠짐" });
      j++;
    }
  }
  // 한쪽이 먼저 끝나면 남은 글자를 모두 담는다
  while (i < 나.length) {
    결과.push({ 글자: 나[i], 상태: "더씀" });
    i++;
  }
  while (j < 답.length) {
    결과.push({ 글자: 답[j], 상태: "빠짐" });
    j++;
  }

  return 결과;
}


// ------------------------------------------------------------
//  [14] 비교한 결과를 빨간펜 표시가 있는 화면 글자로 만든다
//  빈칸(띄어쓰기)은 눈에 안 보이니까 틀렸을 때만 ∨ 기호로 보여 준다.
// ------------------------------------------------------------
function 빨간펜으로그리기(비교결과) {
  let 화면글 = "";
  for (const 칸 of 비교결과) {
    const 빈칸인가 = (칸.글자 === " ");
    // '<'나 '&' 같은 글자가 화면을 망가뜨리지 않게 바꿔 준다
    const 안전한글자 = 칸.글자.replace(/&/g, "&amp;").replace(/</g, "&lt;");

    if (칸.상태 === "맞음") {
      화면글 += "<span class='글자'>" + 안전한글자 + "</span>";
    } else if (칸.상태 === "더씀") {
      화면글 += "<span class='글자 더씀'>" + (빈칸인가 ? "∨" : 안전한글자) + "</span>";
    } else {
      화면글 += "<span class='글자 빠짐'>" + (빈칸인가 ? "∨" : 안전한글자) + "</span>";
    }
  }
  return 화면글;
}


// ------------------------------------------------------------
//  [15] 받아쓰기 문장 하나를 보여 준다
// ------------------------------------------------------------
function 문장보여주기() {
  const 낱말 = 받아쓰기순서[받아쓰기번호];

  받아쓰기진행.textContent =
    (받아쓰기번호 + 1) + "번 / 모두 " + 받아쓰기순서.length + "문장";

  // 지난 문장의 흔적을 지운다
  받아쓰기입력.value = "";
  받아쓰기입력.disabled = false;
  받아쓰기채점칸.hidden = true;
  받아쓰기채점칸.innerHTML = "";
  채점버튼.hidden = false;
  받아쓰기다음버튼.hidden = true;
  받아쓰기알림칸.textContent = "";
  다시보기썼나 = false;
  들은횟수 = 0;
  말하기멈추기();                 // 지난 문장을 읽던 소리가 있으면 멈춘다

  if (받아쓰기방식 === "듣기") {
    // 듣고 쓰기: 문장은 가려 두고 '듣기' 버튼을 준다
    듣기준비하기();
    듣기버튼.focus();
  } else {
    // 보고 쓰기: 문장을 보여 주고 시간을 재기 시작한다
    듣기상자.hidden = true;
    문장보이며시간재기(낱말);
    받아쓰기입력.focus();
  }
}


// ============================================================
//  여기부터 [15-5]~[15-10]은 4단계에서 만든 '듣고 쓰기'
// ============================================================

// ------------------------------------------------------------
//  [15-5] 브라우저의 말하기 도구를 가져온다
//  이 도구가 없는 브라우저도 있으니, 없으면 null을 돌려준다.
// ------------------------------------------------------------
function 말하기도구() {
  if (window.speechSynthesis && typeof SpeechSynthesisUtterance !== "undefined") {
    return window.speechSynthesis;
  }
  return null;
}


// ------------------------------------------------------------
//  [15-6] 목소리들 중에서 한국어 목소리를 하나 고른다
//  컴퓨터 안에 있는 목소리(localService)를 먼저 고르고, 없으면 다른 한국어 목소리.
// ------------------------------------------------------------
function 한국어목소리고르기(목소리들) {
  const 한국어목소리들 = [];
  for (const 목소리 of 목소리들) {
    // 'ko-KR'도 있고 'ko_KR'도 있어서 앞의 'ko'만 본다
    const 언어 = String(목소리.lang || "").toLowerCase();
    if (언어.indexOf("ko") === 0) 한국어목소리들.push(목소리);
  }
  for (const 목소리 of 한국어목소리들) {
    if (목소리.localService === true) return 목소리;
  }
  return 한국어목소리들.length > 0 ? 한국어목소리들[0] : null;
}


// ------------------------------------------------------------
//  [15-7] 목소리 찾기
//  getVoices()는 처음엔 빈 배열일 수 있어서 'voiceschanged'를 기다린다.
//  2초를 기다려도 한국어 목소리가 없으면 '없음'으로 정한다.
// ------------------------------------------------------------
function 목소리찾기시작() {
  const 도구 = 말하기도구();
  if (!도구) {
    목소리기다림끝 = true;        // 말하기 도구가 아예 없다
    목소리다시보기();
    return;
  }
  도구.addEventListener("voiceschanged", 목소리다시보기);
  목소리다시보기();
  setTimeout(function () {
    목소리기다림끝 = true;
    목소리다시보기();
  }, 2000);
}


// 지금 있는 목소리를 다시 살펴보고 준비 화면을 바꾼다
function 목소리다시보기() {
  const 도구 = 말하기도구();
  const 목소리들 = 도구 ? 도구.getVoices() : [];
  고른목소리 = 한국어목소리고르기(목소리들 || []);

  if (고른목소리) {
    듣기고르기칸.hidden = false;
    목소리안내칸.textContent = "";
  } else {
    듣기고르기칸.hidden = true;
    // '듣고 쓰기'를 골라 두었는데 목소리가 없어졌으면 5초 보기로 바꾼다
    const 듣기칸 = document.querySelector("input[name='보기시간'][value='듣기']");
    if (듣기칸.checked) {
      document.querySelector("input[name='보기시간'][value='5']").checked = true;
    }
    목소리안내칸.textContent = 목소리기다림끝
      ? "이 컴퓨터에는 한국어 읽어 주기 목소리가 없어서, 문장을 잠깐 보여 주는 방식으로 해요."
      : "한국어 목소리를 찾고 있어요...";
  }
}


// ------------------------------------------------------------
//  [15-8] 듣고 쓰기 준비: 문장을 가리고 '듣기' 버튼을 보여 준다
// ------------------------------------------------------------
function 듣기준비하기() {
  시간재기멈추기();
  문장상태 = "듣는중";
  보기문장칸.textContent = "귀로 듣고 써 보세요";
  보기문장칸.classList.add("가려짐");
  시간상자.hidden = true;
  다시보기버튼.hidden = true;
  듣기상자.hidden = false;
  듣기버튼.hidden = false;
  다시듣기버튼.hidden = true;
  들은횟수글.textContent = "";
}


// ------------------------------------------------------------
//  [15-9] 문장을 소리 내어 읽는다
//  말하기 전에 cancel()로 먼저 멈춰서, 여러 번 눌러도 소리가 겹치지 않는다.
//  이미 읽는 중에 누르면 처음부터 다시 읽지만, 들은 횟수는 늘리지 않는다.
// ------------------------------------------------------------
function 문장읽기() {
  if (문장상태 !== "듣는중") return;       // 채점한 뒤에는 읽지 않는다
  const 도구 = 말하기도구();
  if (!도구 || !고른목소리) {
    듣기실패();                             // 목소리가 사라졌으면 보기로 바꾼다
    return;
  }

  if (!말하는중) 들은횟수++;
  도구.cancel();                            // 먼저 멈추고 (소리 겹침 막기)

  const 발화 = new SpeechSynthesisUtterance(받아쓰기순서[받아쓰기번호].문장);
  발화.lang = "ko-KR";
  발화.voice = 고른목소리;
  발화.rate = 0.9;                          // 조금 천천히 읽는다

  // 다 읽었거나 멈췄을 때: 지금 읽는 발화일 때만 '말하는중'을 끈다
  // (cancel로 멈춘 옛날 발화의 소식이 늦게 와도 새 발화를 방해하지 않게)
  발화.onend = function () {
    if (지금발화 === 발화) { 말하는중 = false; 지금발화 = null; }
  };
  발화.onerror = function (사건) {
    if (지금발화 !== 발화) return;
    말하는중 = false;
    지금발화 = null;
    // 우리가 멈춘 것이 아니라 진짜로 소리가 안 나는 경우에만 보기로 바꾼다
    const 까닭 = 사건 && 사건.error;
    if (까닭 !== "canceled" && 까닭 !== "interrupted") 듣기실패();
  };

  지금발화 = 발화;
  말하는중 = true;
  도구.speak(발화);

  // 첫 '듣기' 뒤에는 '다시 듣기' 버튼으로 바꾼다
  if (!듣기버튼.hidden) {
    듣기버튼.hidden = true;
    다시듣기버튼.hidden = false;
    다시듣기버튼.focus();
  }
  들은횟수글.textContent = "들은 횟수: " + 들은횟수 + "번";
}


// ------------------------------------------------------------
//  [15-10] 소리가 안 나면 '잠깐 보여 주기'(5초)로 자동으로 바꾼다
// ------------------------------------------------------------
function 듣기실패() {
  if (문장상태 !== "듣는중") return;
  말하기멈추기();
  받아쓰기방식 = "보기";
  보기시간초 = 5;
  듣기상자.hidden = true;
  문장보이며시간재기(받아쓰기순서[받아쓰기번호]);
  받아쓰기알림칸.textContent = "소리가 나지 않아서 문장을 5초 동안 보여 주는 방식으로 바꿨어요.";
  받아쓰기입력.focus();
}


// 읽어 주던 소리를 멈춘다
function 말하기멈추기() {
  지금발화 = null;                 // 먼저 비워서, 멈춘 발화의 소식은 무시되게 한다
  말하는중 = false;
  const 도구 = 말하기도구();
  if (도구) 도구.cancel();
}


// ------------------------------------------------------------
//  [15-1] 문장을 보여 주고, 정한 시간이 지나면 가린다
//  '계속 보기'(0초)를 골랐으면 시간을 재지 않고 계속 보여 준다.
// ------------------------------------------------------------
function 문장보이며시간재기(낱말) {
  시간재기멈추기();              // 혹시 재던 시간이 있으면 먼저 멈춘다
  문장상태 = "보는중";
  보기문장칸.textContent = 낱말.문장;
  보기문장칸.classList.remove("가려짐");
  다시보기버튼.hidden = true;

  if (보기시간초 === 0) {
    시간상자.hidden = true;      // 계속 보기: 시간 표시가 필요 없다
    return;
  }

  시간상자.hidden = false;
  끝나는시각 = Date.now() + 보기시간초 * 1000;
  남은시간그리기();
  // 0.1초마다 남은 시간을 다시 그린다 (막대기가 부드럽게 줄어든다)
  시간재기번호 = setInterval(남은시간그리기, 100);
}


// ------------------------------------------------------------
//  [15-2] 남은 시간을 숫자와 막대기로 보여 준다
//  시간이 다 되면 문장을 가린다.
// ------------------------------------------------------------
function 남은시간그리기() {
  const 남은밀리초 = Math.max(0, 끝나는시각 - Date.now());
  const 남은초 = Math.ceil(남은밀리초 / 1000);
  const 퍼센트 = Math.round(남은밀리초 / (보기시간초 * 1000) * 100);

  남은시간글.textContent = "남은 시간: " + 남은초 + "초";
  시간막대.style.width = 퍼센트 + "%";
  시간막대틀.setAttribute("aria-valuenow", 퍼센트);

  if (남은밀리초 <= 0) {
    문장가리기();
  }
}


// ------------------------------------------------------------
//  [15-3] 문장을 가린다
//  이미 채점했으면 아무것도 하지 않는다. (채점과 시간 끝이 동시에 와도 안전)
// ------------------------------------------------------------
function 문장가리기() {
  시간재기멈추기();
  if (문장상태 !== "보는중") return;

  문장상태 = "가려짐";
  보기문장칸.textContent = "문장이 가려졌어요";
  보기문장칸.classList.add("가려짐");
  남은시간글.textContent = "시간 끝!";
  시간막대.style.width = "0%";

  // 아직 '한 번 더 보기'를 안 썼으면 버튼을 보여 준다
  다시보기버튼.hidden = 다시보기썼나;
  받아쓰기알림칸.textContent = 다시보기썼나
    ? "문장이 가려졌어요. 기억해서 써 보세요."
    : "문장이 가려졌어요. 기억해서 써 보세요. 한 번 더 볼 수 있어요.";
}


// ------------------------------------------------------------
//  [15-4] '한 번 더 보기' - 한 문장에 딱 1번만 된다
//  여러 번 빠르게 눌러도 첫 번째만 받아들인다.
// ------------------------------------------------------------
function 한번더보기() {
  if (문장상태 !== "가려짐") return;  // 가려진 때만 누를 수 있다
  if (다시보기썼나) return;           // 이미 썼으면 무시한다

  다시보기썼나 = true;
  받아쓰기알림칸.textContent = "";
  문장보이며시간재기(받아쓰기순서[받아쓰기번호]);
  받아쓰기입력.focus();               // 버튼이 사라지니 입력칸으로 돌아간다
}


// 재던 시간을 멈춘다
function 시간재기멈추기() {
  if (시간재기번호 !== null) {
    clearInterval(시간재기번호);
    시간재기번호 = null;
  }
}


// ------------------------------------------------------------
//  [16] 받아쓰기 채점하기
//  띄어쓰기를 정리한 뒤 한 글자씩 비교해서 틀린 곳에 빨간 표시를 한다.
// ------------------------------------------------------------
function 받아쓰기채점하기() {
  // 이미 채점한 문장은 다시 채점하지 않는다 (엔터를 두 번 눌러도 점수가 두 번 안 오르게)
  if (문장상태 === "채점됨") return;

  // 시간이 남아 있어도 바로 채점한다: 시간을 멈추고 '한 번 더 보기'도 감춘다
  시간재기멈추기();
  말하기멈추기();                 // 읽어 주던 소리도 멈춘다
  문장상태 = "채점됨";
  시간상자.hidden = true;
  다시보기버튼.hidden = true;
  듣기상자.hidden = true;
  받아쓰기알림칸.textContent = "";

  const 낱말 = 받아쓰기순서[받아쓰기번호];
  보기문장칸.textContent = 낱말.문장;       // 채점할 때는 문장을 다시 보여 준다
  보기문장칸.classList.remove("가려짐");

  const 내답 = 띄어쓰기정리(받아쓰기입력.value);
  const 정답문장 = 띄어쓰기정리(낱말.문장);

  const 맞았다 = (내답 === 정답문장);
  if (맞았다) {
    받아쓰기맞힌수++;
  } else {
    틀린낱말들.push(낱말);   // 나중에 이 낱말로만 퀴즈를 낸다
  }

  // 한 글자씩 비교한다
  const 비교결과 = 글자비교하기(내답, 정답문장);

  // 틀린 글자와 빠뜨린 글자를 따로 모아서 글로도 알려 준다
  // (색깔이 안 보이는 사람도 알 수 있게)
  const 틀린글자 = [];
  const 빠진글자 = [];
  for (const 칸 of 비교결과) {
    if (칸.상태 === "더씀") 틀린글자.push(칸.글자 === " " ? "띄어쓰기" : 칸.글자);
    if (칸.상태 === "빠짐") 빠진글자.push(칸.글자 === " " ? "띄어쓰기" : 칸.글자);
  }

  let 설명 = "";
  if (내답 === "") {
    설명 = "<p class='이유줄'>아직 아무것도 쓰지 않았어요.</p>";
  } else {
    if (틀린글자.length > 0) {
      설명 += "<p class='이유줄'>잘못 쓴 글자: " + 틀린글자.join(", ") + "</p>";
    }
    if (빠진글자.length > 0) {
      설명 += "<p class='이유줄'>빠뜨린 글자: " + 빠진글자.join(", ") + "</p>";
    }
  }

  // 몇 번 들었는지, 또는 '한 번 더 보기'를 썼는지 채점 결과에 남긴다
  if (받아쓰기방식 === "듣기") {
    설명 += "<p class='다시보기줄'>" +
      (들은횟수 === 0 ? "들은 횟수: 한 번도 안 들었어요" : "들은 횟수: " + 들은횟수 + "번") +
      "</p>";
  } else if (보기시간초 === 0) {
    설명 += "<p class='다시보기줄'>보기 방식: 계속 보기 (연습)</p>";
  } else if (다시보기썼나) {
    설명 += "<p class='다시보기줄'>한 번 더 보기: 썼어요</p>";
  } else {
    설명 += "<p class='다시보기줄'>한 번 더 보기: 안 쓰고 해냈어요!</p>";
  }

  받아쓰기채점칸.className = 맞았다 ? "채점결과 맞음" : "채점결과 틀림";
  받아쓰기채점칸.innerHTML =
    "<p class='판정'>" + (맞았다 ? "O 맞았어요!" : "X 틀렸어요") + "</p>" +
    "<p class='글자줄라벨'>내가 쓴 것</p>" +
    "<p class='글자줄'>" + 빨간펜으로그리기(비교결과) + "</p>" +
    "<p class='정답줄'>정답: <strong>" + 정답문장 + "</strong></p>" +
    설명;
  받아쓰기채점칸.hidden = false;

  // 답을 고쳐 쓰지 못하게 잠그고 다음으로 넘어갈 준비를 한다
  받아쓰기입력.disabled = true;
  채점버튼.hidden = true;
  받아쓰기다음버튼.textContent =
    (받아쓰기번호 === 받아쓰기순서.length - 1) ? "점수 보기" : "다음 문장";
  받아쓰기다음버튼.hidden = false;
  받아쓰기다음버튼.focus();
}


// ------------------------------------------------------------
//  [17] 다음 문장으로 넘어가거나, 다 쓰면 점수를 보여 준다
// ------------------------------------------------------------
function 다음문장() {
  받아쓰기번호++;
  if (받아쓰기번호 < 받아쓰기순서.length) {
    문장보여주기();
  } else {
    받아쓰기결과보여주기();
  }
}


// 받아쓰기 점수 화면
function 받아쓰기결과보여주기() {
  화면보이기(받아쓰기결과화면);

  const 전체 = 받아쓰기순서.length;
  받아쓰기점수칸.textContent = 전체 + "문장 중 " + 받아쓰기맞힌수 + "문장 정답!";
  기록남기기("받아쓰기", 이번받아쓰기방식이름, 받아쓰기맞힌수, 전체);   // 점수를 기록장에 적는다

  if (틀린낱말들.length === 0) {
    틀린낱말목록칸.textContent = "틀린 곳이 하나도 없어요. 정말 잘했어요!";
    틀린낱말퀴즈버튼.hidden = true;
    받아쓰기다시버튼.focus();
  } else {
    // 틀린 낱말을 글자로 보여 준다
    const 낱말이름들 = [];
    for (const 낱말 of 틀린낱말들) {
      낱말이름들.push(낱말.정답);
    }
    틀린낱말목록칸.textContent = "틀린 낱말: " + 낱말이름들.join(", ");
    틀린낱말퀴즈버튼.textContent =
      "틀린 낱말 " + 틀린낱말들.length + "개로 퀴즈 풀기";
    틀린낱말퀴즈버튼.hidden = false;
    틀린낱말퀴즈버튼.focus();
  }
}


// 받아쓰기 준비 화면을 보여 준다 (보여 줄 시간을 고르는 곳)
function 받아쓰기준비하기() {
  화면보이기(받아쓰기준비화면);
  const 고른칸 = document.querySelector("input[name='보기시간']:checked");
  if (고른칸) 고른칸.focus();
}


// 받아쓰기를 처음부터 시작한다
function 받아쓰기시작() {
  받아쓰기순서 = 배열섞기(낱말자료.slice());
  받아쓰기번호 = 0;
  받아쓰기맞힌수 = 0;
  틀린낱말들 = [];

  // 기록에 적을 받아쓰기 방식 이름 (시작할 때 고른 방식)
  if (받아쓰기방식 === "듣기") 이번받아쓰기방식이름 = "듣고 쓰기";
  else if (보기시간초 === 0) 이번받아쓰기방식이름 = "계속 보기";
  else 이번받아쓰기방식이름 = 보기시간초 + "초 보기";

  화면보이기(받아쓰기화면);
  문장보여주기();
}


// ============================================================
//  여기부터 [19]~[22]는 6단계에서 만든 '내 기록'
// ============================================================

// 기록장 이름 (브라우저 안에 이 이름으로 저장된다)
const 기록장이름 = "세종대왕의빨간펜_기록";
const 최대저장수 = 100;   // 기록이 끝없이 쌓이지 않게 최근 100개만 남긴다
const 보여줄수 = 10;      // 화면에는 최근 10개만 보여 준다


// ------------------------------------------------------------
//  [19] 기록장을 읽는다
//  저장이 막혀 있거나 내용이 망가져 있어도 앱이 멈추지 않게 빈 목록을 돌려준다.
// ------------------------------------------------------------
function 기록읽기() {
  try {
    const 글 = window.localStorage.getItem(기록장이름);
    if (!글) return [];
    const 목록 = JSON.parse(글);
    if (!Array.isArray(목록)) return [];
    // 모양이 이상한 기록은 빼고 쓴다
    return 목록.filter(function (기록) {
      return 기록 && typeof 기록.날짜 === "string" &&
             typeof 기록.맞힌수 === "number" && typeof 기록.전체 === "number";
    });
  } catch (문제) {
    return [];
  }
}


// ------------------------------------------------------------
//  [20] 기록 하나를 기록장에 적는다 (날짜, 활동, 종류, 점수)
//  저장이 안 되는 브라우저라도 점수 화면은 그대로 보이게 조용히 넘어간다.
// ------------------------------------------------------------
function 기록남기기(활동, 종류, 맞힌수, 전체) {
  const 지금 = new Date();
  const 두자리 = function (수) { return (수 < 10 ? "0" : "") + 수; };
  const 새기록 = {
    날짜: 지금.getFullYear() + "년 " + (지금.getMonth() + 1) + "월 " + 지금.getDate() + "일 " +
          두자리(지금.getHours()) + ":" + 두자리(지금.getMinutes()),
    활동: 활동,
    종류: 종류,
    맞힌수: 맞힌수,
    전체: 전체
  };

  const 목록 = 기록읽기();
  목록.push(새기록);
  while (목록.length > 최대저장수) 목록.shift();   // 너무 오래된 기록은 버린다

  try {
    window.localStorage.setItem(기록장이름, JSON.stringify(목록));
    return true;
  } catch (문제) {
    return false;
  }
}


// ------------------------------------------------------------
//  [20-1] 저장소를 쓸 수 있는지 알아본다
//  시험 삼아 한 번 적었다가 바로 지워 본다. 실패하면 막혀 있는 것이다.
// ------------------------------------------------------------
function 저장소쓸수있나() {
  try {
    const 시험이름 = 기록장이름 + "_시험";
    window.localStorage.setItem(시험이름, "1");
    window.localStorage.removeItem(시험이름);
    return true;
  } catch (문제) {
    return false;
  }
}


// ------------------------------------------------------------
//  [21] 내 기록 화면: 최근 기록 10개를 새것부터 보여 준다
//  기록이 하나도 없으면 안내 글만 보여 주고 '기록 지우기'는 감춘다.
// ------------------------------------------------------------
function 기록보여주기() {
  화면보이기(기록화면);
  기록목록칸.innerHTML = "";

  const 목록 = 기록읽기();
  if (목록.length === 0) {
    // 저장소가 막혀 있으면 '기록 없음' 대신 저장할 수 없다고 알려 준다
    기록안내칸.textContent = 저장소쓸수있나()
      ? "아직 기록이 없어요. 퀴즈나 받아쓰기를 끝까지 해 보세요!"
      : "이 브라우저에서는 기록을 저장할 수 없어요.";
    기록목록칸.hidden = true;
    기록지우기버튼.hidden = true;
    document.querySelector("#기록화면 .처음버튼").focus();
    return;
  }

  기록안내칸.textContent = "최근 기록 " + Math.min(목록.length, 보여줄수) + "개 (새 기록이 맨 위)";
  기록목록칸.hidden = false;
  기록지우기버튼.hidden = false;

  // 뒤에서부터(새것부터) 10개만 꺼낸다
  const 최근 = 목록.slice(-보여줄수).reverse();
  for (const 기록 of 최근) {
    const 줄 = document.createElement("li");
    // textContent로 넣어서 이상한 글자가 있어도 화면이 안 망가진다
    줄.textContent = 기록.날짜 + " · " + 기록.활동 + " (" + 기록.종류 + ") · " +
                     기록.전체 + "개 중 " + 기록.맞힌수 + "개 정답";
    기록목록칸.appendChild(줄);
  }
  기록지우기버튼.focus();
}


// ------------------------------------------------------------
//  [22] 기록 지우기 - "정말 지울까요?"라고 먼저 물어본다
// ------------------------------------------------------------
function 기록지우기() {
  if (!window.confirm("정말 지울까요? 지운 기록은 되돌릴 수 없어요.")) return;
  try {
    window.localStorage.removeItem(기록장이름);
  } catch (문제) {
    // 저장소를 쓸 수 없으면 지울 것도 없다
  }
  기록보여주기();
}


// ------------------------------------------------------------
//  [18] 버튼을 눌렀을 때 할 일을 연결해 둔다
// ------------------------------------------------------------
퀴즈고르기버튼.addEventListener("click", function () {

받아쓰기고르기버튼.addEventListener("click", 받아쓰기준비하기);
내기록버튼.addEventListener("click", 기록보여주기);

// 준비 화면에서 고른 시간을 읽고 받아쓰기를 시작한다
받아쓰기시작버튼.addEventListener("click", function () {
  const 고른칸 = document.querySelector("input[name='보기시간']:checked");
  const 고른값 = 고른칸 ? 고른칸.value : "5";

  if (고른값 === "듣기" && 고른목소리) {
    받아쓰기방식 = "듣기";
  } else if (고른값 === "듣기") {
    // 듣기를 골랐는데 한국어 목소리가 없으면 5초 보기로 바꾼다
    받아쓰기방식 = "보기";
    보기시간초 = 5;
  } else {
    받아쓰기방식 = "보기";
    보기시간초 = Number(고른값);
  }
  받아쓰기시작();
});

다시보기버튼.addEventListener("click", 한번더보기);
듣기버튼.addEventListener("click", 문장읽기);
다시듣기버튼.addEventListener("click", 문장읽기);

// 창을 닫거나 다른 페이지로 갈 때도 읽던 소리를 멈춘다

틀린낱말퀴즈버튼.addEventListener("click", function () {

// 입력칸에서 엔터를 누르면 채점되게 한다 (키보드만으로 쓰기 편하게)

  }
});

// '처음으로' 버튼은 여러 화면에 있어서 한꺼번에 연결한다

for (const 버튼 of 처음버튼들) {
