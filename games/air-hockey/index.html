<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script src="../../shared/home-button.js" data-pos="bottom-left"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>에어하키</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #24364a;
    --card: rgba(255, 255, 255, 0.95);
    --red: #e5484d;
    --blue: #3b82f6;
    --easy: #4cc38a;
    --normal: #f5a524;
    --hard: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(circle at 50% 30%, #dff3ff, #a9d4ee);
    font-family: 'Jua', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    width: min(100vw, calc(100vh * 2 / 3));
    aspect-ratio: 2 / 3;
    border-radius: 18px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(20, 60, 100, 0.3);
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  canvas.playing { cursor: none; }

  .screen {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    background: rgba(200, 230, 250, 0.45);
    backdrop-filter: blur(2px);
  }
  .hidden { display: none !important; }
  .card {
    width: 100%; max-width: 380px; max-height: 100%; overflow-y: auto;
    background: var(--card); border-radius: 22px;
    padding: 20px 18px; text-align: center;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
  }
  h1 { margin: 0; font-size: clamp(36px, 9vmin, 50px); color: var(--blue); text-shadow: 3px 3px 0 #d6ecff; }
  h2 { margin: 0 0 10px; font-size: 34px; }
  .sub { margin: 4px 0 14px; font-size: 17px; color: #5c6b7a; }
  .label { font-size: 17px; margin: 12px 0 6px; color: #5c6b7a; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 18px; color: #fff; cursor: pointer;
    border: none; border-radius: 14px; padding: 11px 16px;
    background: var(--blue); box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
    transition: transform 0.08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0, 0, 0, 0.15); }
  .pick button { flex: 1; background: #e9eef3; color: var(--ink); }
  .pick button.on { color: #fff; background: var(--blue); }
  .pick button.on[data-diff="easy"] { background: var(--easy); }
  .pick button.on[data-diff="normal"] { background: var(--normal); }
  .pick button.on[data-diff="hard"] { background: var(--hard); }
  button.start { width: 100%; font-size: 28px; padding: 14px; margin-top: 16px; background: var(--red); }
  button.ghost { background: #e9eef3; color: var(--ink); }
  .howto { font-size: 15px; color: #5c6b7a; margin-top: 12px; line-height: 1.6; }
  .stats { font-size: 15px; color: #5c6b7a; margin-top: 8px; }
  .final { font-size: 52px; margin: 6px 0 14px; }
  .final .me { color: var(--red); }
  .final .cpu { color: var(--blue); }

  #hud { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; }
  #hud button {
    width: 40px; height: 40px; padding: 0; font-size: 20px;
    background: rgba(255, 255, 255, 0.85); color: var(--ink);
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>

  <div id="hud" class="hidden">
    <button id="soundBtn" title="소리">🔊</button>
    <button id="pauseBtn" title="일시정지 (P)">⏸</button>
  </div>

  <div id="startScreen" class="screen">
    <div class="card">
      <h1>에어하키</h1>
      <p class="sub">컴퓨터 골대에 퍽을 넣어라!</p>
      <div class="label">몇 점 먼저?</div>
      <div class="row pick" id="pickGoal">
        <button data-goal="3">3점</button>
        <button data-goal="5">5점</button>
        <button data-goal="7">7점</button>
      </div>
      <div class="label">컴퓨터 실력</div>
      <div class="row pick" id="pickDiff">
        <button data-diff="easy">쉬움</button>
        <button data-diff="normal">보통</button>
        <button data-diff="hard">어려움</button>
      </div>
      <div class="label">퍽 속도</div>
      <div class="row pick" id="pickSpeed">
        <button data-speed="slow">느리게</button>
        <button data-speed="normal">보통</button>
        <button data-speed="fast">빠르게</button>
      </div>
      <button class="start" id="startBtn">시작!</button>
      <div class="stats" id="stats"></div>
      <div class="howto">마우스나 손가락으로 빨간 말렛을 움직여요<br>P / Esc = 일시정지</div>
    </div>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <div class="card">
      <h2>잠깐 멈춤</h2>
      <div class="row">
        <button id="resumeBtn">계속하기</button>
        <button class="ghost" id="quitBtn">처음으로</button>
      </div>
    </div>
  </div>

  <div id="endScreen" class="screen hidden">
    <div class="card">
      <h2 id="endTitle"></h2>
      <div class="final"><span class="me" id="endMe">0</span> : <span class="cpu" id="endCpu">0</span></div>
      <div class="row">
        <button id="againBtn">다시 하기</button>
        <button class="ghost" id="homeBtn">처음으로</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- 기본 크기 (논리 좌표) ----------
  const W = 400, H = 600;
  const B = 14;                       // 테두리 두께
  const L = B, R = W - B, T = B, BOT = H - B;
  const CX = W / 2, CY = H / 2;
  const GOAL = 130;                   // 골대 폭
  const PR = 15;                      // 퍽 반지름
  const MR = 28;                      // 말렛 반지름
  const MAX_MALLET = 2400;            // 내 말렛 최고 속도
  const WALL_E = 0.88;                // 벽 튕김
  const HIT_E = 0.9;                  // 말렛 튕김

  // 퍽 속도 단계: max = 최고 속도, power = 칠 때 힘, friction = 1초 동안 남는 속도 비율
  const SPEED = {
    slow:   { max: 850,  power: 0.65, friction: 0.7 },
    normal: { max: 1200, power: 0.82, friction: 0.78 },
    fast:   { max: 1550, power: 1.0,  friction: 0.84 },
  };
  const SUBSTEPS = 6;

  const DIFF = {
    easy:   { speed: 520,  err: 45, predict: false, attackMax: 260 },
    normal: { speed: 880,  err: 20, predict: true,  attackMax: 520 },
    hard:   { speed: 1350, err: 6,  predict: true,  attackMax: 900 },
  };
  const DIFF_NAME = { easy: '쉬움', normal: '보통', hard: '어려움' };

  // ---------- 저장 ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const settings = Object.assign({ goal: 5, diff: 'normal', speed: 'normal', sound: true }, store.get('airhockey.settings', {}));
  const stats = store.get('airhockey.stats', {});

  // ---------- 캔버스 ----------
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let scale = 1;
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
    scale = canvas.width / W;
  }
  window.addEventListener('resize', resize);
  resize();

  // 얼음 긁힌 자국 (한 번만 만들기)
  const scratches = [];
  for (let i = 0; i < 70; i++) {
    const x = L + Math.random() * (R - L), y = T + Math.random() * (BOT - T);
    const a = Math.random() * Math.PI, len = 10 + Math.random() * 40;
    scratches.push([x, y, x + Math.cos(a) * len, y + Math.sin(a) * len]);
  }

  // ---------- 소리 ----------
  let actx = null;
  function beep(freq, dur, type = 'sine', vol = 0.15, slide = 0) {
    if (!settings.sound) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const t = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g).connect(actx.destination);
      o.start(t); o.stop(t + dur);
    } catch (e) {}
  }
  let lastSound = 0;
  function hitSound(power) {
    const now = performance.now();
    if (now - lastSound < 40) return;
    lastSound = now;
    beep(260 + Math.min(power, 1500) * 0.3, 0.08, 'triangle', 0.08 + Math.min(power / 1500, 1) * 0.15);
  }
  function wallSound(power) {
    const now = performance.now();
    if (power < 60 || now - lastSound < 40) return;
    lastSound = now;
    beep(160, 0.06, 'square', 0.04 + Math.min(power / 1500, 1) * 0.06);
  }
  function goalSound(mine) {
    const notes = mine ? [523, 659, 784, 1047] : [392, 330, 262];
    notes.forEach((f, i) => setTimeout(() => beep(f, 0.18, 'triangle', 0.18), i * 110));
  }

  // ---------- 게임 상태 ----------
  const puck = { x: CX, y: CY, vx: 0, vy: 0, trail: [] };
  const me = { x: CX, y: BOT - 70, vx: 0, vy: 0 };
  const cpu = { x: CX, y: T + 70, vx: 0, vy: 0, mode: 'defend', modeT: 0, aimX: CX, errX: 0, errT: 0 };
  const target = { x: CX, y: BOT - 70 };

  let state = 'menu';    // menu | count | play | goal | paused | end
  let score = { me: 0, cpu: 0 };
  let timer = 0;
  let lastScorer = null;
  let stallT = 0;
  let pausedFrom = null;

  function placeForServe(receiver) {
    puck.x = CX; puck.vx = 0; puck.vy = 0; puck.trail = [];
    puck.y = receiver === 'me' ? CY + 90 : receiver === 'cpu' ? CY - 90 : CY;
    me.x = CX; me.y = BOT - 70; me.vx = me.vy = 0;
    cpu.x = CX; cpu.y = T + 70; cpu.vx = cpu.vy = 0; cpu.mode = 'defend';
    stallT = 0;
  }

  function startGame() {
    score = { me: 0, cpu: 0 };
    placeForServe(null);
    target.x = me.x; target.y = me.y;
    state = 'count'; timer = 3;
    show(null);
    hud.classList.remove('hidden');
    canvas.classList.add('playing');
  }

  // ---------- 입력 ----------
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
  }
  function onPointer(e) {
    const p = toLogical(e);
    target.x = p.x; target.y = p.y;
  }
  canvas.addEventListener('pointermove', onPointer);
  canvas.addEventListener('pointerdown', onPointer);

  window.addEventListener('keydown', (e) => {
    if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  });

  // ---------- 물리 ----------
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  function moveMallet(m, tx, ty, maxSpeed, minY, maxY, h) {
    tx = clamp(tx, L + MR, R - MR);
    ty = clamp(ty, minY, maxY);
    let dx = tx - m.x, dy = ty - m.y;
    const d = Math.hypot(dx, dy), maxStep = maxSpeed * h;
    if (d > maxStep) { dx = dx / d * maxStep; dy = dy / d * maxStep; }
    m.x += dx; m.y += dy;
    m.vx = dx / h; m.vy = dy / h;
  }

  function keepPuckIn() {
    if (puck.x - PR < L) puck.x = L + PR;
    if (puck.x + PR > R) puck.x = R - PR;
    const inMouth = Math.abs(puck.x - CX) < GOAL / 2;
    if (!inMouth) {
      if (puck.y - PR < T) puck.y = T + PR;
      if (puck.y + PR > BOT) puck.y = BOT - PR;
    }
  }

  function malletHit(m, minY, maxY) {
    const dx = puck.x - m.x, dy = puck.y - m.y;
    const d = Math.hypot(dx, dy), min = PR + MR;
    if (d >= min || d === 0) return;
    const nx = dx / d, ny = dy / d;
    puck.x = m.x + nx * min; puck.y = m.y + ny * min;
    const rv = (puck.vx - m.vx) * nx + (puck.vy - m.vy) * ny;
    if (rv < 0) {
      const k = (1 + HIT_E) * rv * SPEED[settings.speed].power;
      puck.vx -= k * nx;
      puck.vy -= k * ny;
      hitSound(-rv);
    }
    // 퍽이 벽에 끼면 말렛을 밀어냄 (퍽이 말렛을 뚫지 않게)
    keepPuckIn();
    const d2 = Math.hypot(puck.x - m.x, puck.y - m.y);
    if (d2 < min) {
      m.x = clamp(puck.x - nx * min, L + MR, R - MR);
      m.y = clamp(puck.y - ny * min, minY, maxY);
    }
  }

  function postHit(px, py) {
    const dx = puck.x - px, dy = puck.y - py, d = Math.hypot(dx, dy);
    if (d >= PR || d === 0) return;
    const nx = dx / d, ny = dy / d;
    puck.x = px + nx * PR; puck.y = py + ny * PR;
    const rv = puck.vx * nx + puck.vy * ny;
    if (rv < 0) {
      puck.vx -= (1 + WALL_E) * rv * nx;
      puck.vy -= (1 + WALL_E) * rv * ny;
      wallSound(-rv);
    }
  }

  function walls() {
    if (puck.x - PR < L) { puck.x = L + PR; wallSound(Math.abs(puck.vx)); puck.vx = Math.abs(puck.vx) * WALL_E; }
    if (puck.x + PR > R) { puck.x = R - PR; wallSound(Math.abs(puck.vx)); puck.vx = -Math.abs(puck.vx) * WALL_E; }
    postHit(CX - GOAL / 2, T); postHit(CX + GOAL / 2, T);
    postHit(CX - GOAL / 2, BOT); postHit(CX + GOAL / 2, BOT);
    const inMouth = Math.abs(puck.x - CX) < GOAL / 2;
    if (!inMouth || puck.y > T + PR) {
      if (puck.y - PR < T && !inMouth) { puck.y = T + PR; wallSound(Math.abs(puck.vy)); puck.vy = Math.abs(puck.vy) * WALL_E; }
    }
    if (puck.y + PR > BOT && !inMouth) { puck.y = BOT - PR; wallSound(Math.abs(puck.vy)); puck.vy = -Math.abs(puck.vy) * WALL_E; }
  }

  // ---------- 컴퓨터 ----------
  function predictX(atY) {
    if (puck.vy >= 0) return puck.x;
    const t = (puck.y - atY) / -puck.vy;
    let x = puck.x + puck.vx * t;
    const lo = L + PR, hi = R - PR, span = hi - lo;
    // 벽에 튕기는 것까지 계산
    let u = (x - lo) % (2 * span);
    if (u < 0) u += 2 * span;
    return lo + (u > span ? 2 * span - u : u);
  }

  function cpuTarget(dt) {
    const cfg = DIFF[settings.diff];
    cpu.errT -= dt;
    if (cpu.errT <= 0) { cpu.errX = (Math.random() * 2 - 1) * cfg.err; cpu.errT = 0.4 + Math.random() * 0.4; }

    const speed = Math.hypot(puck.vx, puck.vy);
    const onMySide = puck.y < CY + PR;
    const guardY = T + 62;

    if (cpu.mode === 'strike') {
      cpu.modeT -= dt;
      if (cpu.modeT <= 0 || !onMySide || puck.vy > 200) cpu.mode = 'defend';
    }

    if (cpu.mode !== 'strike') {
      const comingFast = puck.vy < -150 && speed > 320;
      if (onMySide && !comingFast && speed < cfg.attackMax) cpu.mode = 'setup';
      else cpu.mode = 'defend';
    }

    if (cpu.mode === 'defend') {
      const px = cfg.predict ? predictX(guardY) : puck.x;
      const x = CX + clamp(px - CX, -GOAL / 2 - 10, GOAL / 2 + 10) + cpu.errX;
      const y = onMySide && puck.vy < 0 ? guardY : guardY + 20;
      return { x, y };
    }

    // 퍽을 상대 골대 쪽으로 칠 방향
    let ax = cpu.aimX - puck.x, ay = BOT - puck.y;
    const ad = Math.hypot(ax, ay); ax /= ad; ay /= ad;

    if (cpu.mode === 'setup') {
      // 퍽보다 아래에 있으면 (내 골대 쪽으로 칠 위험) 옆으로 돌아감
      if (cpu.y > puck.y - 8) {
        const side = cpu.x < puck.x ? -1 : 1;
        return { x: puck.x + side * (PR + MR + 8), y: puck.y - 14 };
      }
      const sx = puck.x - ax * (PR + MR + 18), sy = puck.y - ay * (PR + MR + 18);
      if (Math.hypot(cpu.x - sx, cpu.y - sy) < 14) {
        cpu.mode = 'strike'; cpu.modeT = 0.35;
      }
      return { x: sx + cpu.errX * 0.3, y: sy };
    }

    // strike
    return { x: puck.x + ax * 45, y: puck.y + ay * 45 };
  }

  // ---------- 진행 ----------
  function goalScored(byMe) {
    if (byMe) score.me++; else score.cpu++;
    lastScorer = byMe ? 'me' : 'cpu';
    goalSound(byMe);
    state = 'goal'; timer = 1.3;
  }

  function step(dt) {
    if (state === 'count') {
      timer -= dt;
      moveMallet(me, target.x, target.y, MAX_MALLET, CY + MR, BOT - MR, dt);
      // 카운트다운 중엔 퍽이 고정 → 말렛이 퍽에 겹치지 않게만
      const dx = me.x - puck.x, dy = me.y - puck.y, d = Math.hypot(dx, dy) || 1;
      if (d < PR + MR) {
        me.x = clamp(puck.x + dx / d * (PR + MR), L + MR, R - MR);
        me.y = clamp(puck.y + dy / d * (PR + MR), CY + MR, BOT - MR);
      }
      if (timer <= 0) { state = 'play'; beep(880, 0.15, 'triangle', 0.15); }
      return;
    }
    if (state === 'goal') {
      timer -= dt;
      puck.vx *= 0.9; puck.vy *= 0.9;
      puck.x += puck.vx * dt; puck.y += puck.vy * dt;
      if (timer <= 0) {
        if (score.me >= settings.goal || score.cpu >= settings.goal) endGame();
        else {
          placeForServe(lastScorer === 'me' ? 'cpu' : 'me');
          state = 'count'; timer = 3;
        }
      }
      return;
    }
    if (state !== 'play') return;

    const ct = cpuTarget(dt);
    const cfg = DIFF[settings.diff];
    const h = dt / SUBSTEPS;
    const sp = SPEED[settings.speed];
    const fr = Math.pow(sp.friction, h);
    for (let i = 0; i < SUBSTEPS; i++) {
      moveMallet(me, target.x, target.y, MAX_MALLET, CY + MR, BOT - MR, h);
      moveMallet(cpu, ct.x, ct.y, cfg.speed, T + MR, CY - MR, h);
      puck.x += puck.vx * h; puck.y += puck.vy * h;
      walls();
      malletHit(me, CY + MR, BOT - MR);
      malletHit(cpu, T + MR, CY - MR);
      puck.vx *= fr; puck.vy *= fr;
      const s = Math.hypot(puck.vx, puck.vy);
      if (s > sp.max) { puck.vx *= sp.max / s; puck.vy *= sp.max / s; }
      if (puck.y < T - PR * 0.2) { goalScored(true); break; }
      if (puck.y > BOT + PR * 0.2) { goalScored(false); break; }
    }

    // 컴퓨터 쪽에서 퍽이 멈춰 버리면 다시 놓기
    if (state === 'play' && puck.y < CY && Math.hypot(puck.vx, puck.vy) < 25) {
      stallT += dt;
      if (stallT > 4) { puck.x = CX; puck.y = CY - 90; puck.vx = puck.vy = 0; stallT = 0; }
    } else stallT = 0;

    puck.trail.push([puck.x, puck.y]);
    if (puck.trail.length > 8) puck.trail.shift();
  }

  function endGame() {
    state = 'end';
    const won = score.me > score.cpu;
    const s = stats[settings.diff] || { w: 0, l: 0 };
    if (won) s.w++; else s.l++;
    stats[settings.diff] = s;
    store.set('airhockey.stats', stats);
    document.getElementById('endTitle').textContent = won ? '🏆 이겼다!' : '아깝다! 다시 도전!';
    document.getElementById('endMe').textContent = score.me;
    document.getElementById('endCpu').textContent = score.cpu;
    hud.classList.add('hidden');
    canvas.classList.remove('playing');
    show(endScreen);
    if (won) [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle', 0.16), i * 120));
  }

  // ---------- 그리기 ----------
  function drawRink() {
    // 테두리
    ctx.fillStyle = '#e9f0f6';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#c9d6e2';
    ctx.fillRect(0, 0, W, B); ctx.fillRect(0, H - B, W, B);
    ctx.fillRect(0, 0, B, H); ctx.fillRect(W - B, 0, B, H);

    // 얼음
    const g = ctx.createLinearGradient(0, T, 0, BOT);
    g.addColorStop(0, '#f4fbff'); g.addColorStop(0.5, '#ffffff'); g.addColorStop(1, '#eef8ff');
    ctx.fillStyle = g;
    ctx.fillRect(L, T, R - L, BOT - T);

    ctx.strokeStyle = 'rgba(160, 200, 225, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (const s of scratches) { ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); }
    ctx.stroke();

    // 파란 선
    ctx.fillStyle = 'rgba(59, 130, 246, 0.55)';
    ctx.fillRect(L, CY - 110, R - L, 7);
    ctx.fillRect(L, CY + 103, R - L, 7);
    // 빨간 중앙선
    ctx.fillStyle = 'rgba(229, 72, 77, 0.6)';
    ctx.fillRect(L, CY - 3, R - L, 6);

    // 중앙 원
    ctx.strokeStyle = 'rgba(59, 130, 246, 0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(CX, CY, 55, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(59, 130, 246, 0.7)';
    ctx.beginPath(); ctx.arc(CX, CY, 5, 0, Math.PI * 2); ctx.fill();

    // 골 크리즈
    ctx.fillStyle = 'rgba(120, 180, 240, 0.25)';
    ctx.strokeStyle = 'rgba(229, 72, 77, 0.55)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(CX, T, 75, 0, Math.PI); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(CX, BOT, 75, Math.PI, Math.PI * 2); ctx.fill(); ctx.stroke();

    // 페이스오프 점
    ctx.fillStyle = 'rgba(229, 72, 77, 0.55)';
    for (const [x, y] of [[CX - 110, CY - 160], [CX + 110, CY - 160], [CX - 110, CY + 160], [CX + 110, CY + 160]]) {
      ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI * 2); ctx.fill();
    }

    // 골대 입구
    ctx.fillStyle = '#2b3a4a';
    ctx.fillRect(CX - GOAL / 2, 0, GOAL, T);
    ctx.fillRect(CX - GOAL / 2, BOT, GOAL, H - BOT);
    ctx.fillStyle = '#e5484d';
    for (const y of [T, BOT]) {
      ctx.beginPath(); ctx.arc(CX - GOAL / 2, y, 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(CX + GOAL / 2, y, 5, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawMallet(m, main, dark) {
    ctx.fillStyle = 'rgba(30, 60, 90, 0.18)';
    ctx.beginPath(); ctx.ellipse(m.x + 3, m.y + 5, MR, MR * 0.92, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(m.x, m.y, MR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = main;
    ctx.beginPath(); ctx.arc(m.x, m.y, MR - 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(m.x, m.y, MR * 0.45, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = main;
    ctx.beginPath(); ctx.arc(m.x - 2, m.y - 2, MR * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.beginPath(); ctx.arc(m.x - 6, m.y - 7, MR * 0.14, 0, Math.PI * 2); ctx.fill();
  }

  function drawPuck() {
    const sp = Math.hypot(puck.vx, puck.vy);
    if (sp > 500) {
      puck.trail.forEach(([x, y], i) => {
        ctx.fillStyle = `rgba(80, 140, 200, ${(i / puck.trail.length) * 0.18})`;
        ctx.beginPath(); ctx.arc(x, y, PR * (0.5 + i / puck.trail.length * 0.5), 0, Math.PI * 2); ctx.fill();
      });
    }
    ctx.fillStyle = 'rgba(30, 60, 90, 0.2)';
    ctx.beginPath(); ctx.ellipse(puck.x + 2, puck.y + 4, PR, PR * 0.9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1d2530';
    ctx.beginPath(); ctx.arc(puck.x, puck.y, PR, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#3d4a5a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(puck.x, puck.y, PR - 4, 0, Math.PI * 2); ctx.stroke();
  }

  function drawScore() {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '34px Jua, sans-serif';
    ctx.fillStyle = 'rgba(59, 130, 246, 0.75)';
    ctx.fillText(score.cpu, L + 26, CY - 30);
    ctx.fillStyle = 'rgba(229, 72, 77, 0.8)';
    ctx.fillText(score.me, L + 26, CY + 32);
    ctx.font = '13px Jua, sans-serif';
    ctx.fillStyle = 'rgba(36, 54, 74, 0.5)';
    ctx.fillText(`${settings.goal}점 승부`, R - 34, CY + 18);
  }

  function bigText(text, color, size = 64) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `${size}px Jua, sans-serif`;
    ctx.lineWidth = 8; ctx.strokeStyle = '#fff';
    ctx.strokeText(text, CX, CY);
    ctx.fillStyle = color;
    ctx.fillText(text, CX, CY);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    drawRink();
    if (state !== 'menu') drawScore();
    drawPuck();
    drawMallet(cpu, '#60a5fa', '#2563eb');
    drawMallet(me, '#f87171', '#dc2626');

    if (state === 'count') {
      bigText(String(Math.ceil(timer)), '#24364a', 80);
    } else if (state === 'goal') {
      bigText(lastScorer === 'me' ? '골!' : '실점…', lastScorer === 'me' ? '#e5484d' : '#3b82f6', 72);
    }
  }

  // ---------- 화면 ----------
  const startScreen = document.getElementById('startScreen');
  const pauseScreen = document.getElementById('pauseScreen');
  const endScreen = document.getElementById('endScreen');
  const hud = document.getElementById('hud');
  const soundBtn = document.getElementById('soundBtn');

  function show(el) {
    for (const s of [startScreen, pauseScreen, endScreen]) s.classList.toggle('hidden', s !== el);
  }

  function refreshMenu() {
    document.querySelectorAll('#pickGoal button').forEach(b => b.classList.toggle('on', +b.dataset.goal === settings.goal));
    document.querySelectorAll('#pickDiff button').forEach(b => b.classList.toggle('on', b.dataset.diff === settings.diff));
    document.querySelectorAll('#pickSpeed button').forEach(b => b.classList.toggle('on', b.dataset.speed === settings.speed));
    const parts = Object.keys(DIFF).filter(k => stats[k]).map(k => `${DIFF_NAME[k]} ${stats[k].w}승 ${stats[k].l}패`);
    document.getElementById('stats').textContent = parts.length ? '내 전적 · ' + parts.join(' · ') : '';
    soundBtn.textContent = settings.sound ? '🔊' : '🔇';
  }

  function goMenu() {
    state = 'menu';
    placeForServe(null);
    hud.classList.add('hidden');
    canvas.classList.remove('playing');
    refreshMenu();
    show(startScreen);
  }

  function togglePause() {
    if (state === 'paused') {
      state = pausedFrom; show(null);
      canvas.classList.add('playing');
    } else if (state === 'play' || state === 'count' || state === 'goal') {
      pausedFrom = state; state = 'paused'; show(pauseScreen);
      canvas.classList.remove('playing');
    }
  }

  document.getElementById('pickGoal').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    settings.goal = +b.dataset.goal; store.set('airhockey.settings', settings); refreshMenu();
  });
  document.getElementById('pickDiff').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    settings.diff = b.dataset.diff; store.set('airhockey.settings', settings); refreshMenu();
  });
  document.getElementById('pickSpeed').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    settings.speed = b.dataset.speed; store.set('airhockey.settings', settings); refreshMenu();
  });
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('againBtn').addEventListener('click', startGame);
  document.getElementById('homeBtn').addEventListener('click', goMenu);
  document.getElementById('quitBtn').addEventListener('click', goMenu);
  document.getElementById('resumeBtn').addEventListener('click', togglePause);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  soundBtn.addEventListener('click', () => {
    settings.sound = !settings.sound; store.set('airhockey.settings', settings); refreshMenu();
  });
  window.addEventListener('blur', () => { if (state === 'play') togglePause(); });

  // ---------- 루프 ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  goMenu();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
