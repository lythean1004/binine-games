<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>빈이네 게임 놀이터</title>
<meta name="description" content="빈이네가 기획하고 만든 게임과 배움 프로그램을 한곳에서 골라 해 볼 수 있어요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
  :root {
    --bg: #fff8ec;
    --bg-dot: #f3e6cc;
    --card: #ffffff;
    --ink: #2b2118;
    --muted: #75665a;
    --line: #ecdcc0;
    --accent: #ff7a3d;
    --chip: #fff1dc;
    --shadow: 0 2px 0 #e8d5b3, 0 10px 24px -14px rgba(90, 60, 20, .35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1713; --bg-dot: #26201a; --card: #26211c; --ink: #f6ece0;
      --muted: #b8a895; --line: #3a3128; --chip: #332a21;
      --shadow: 0 2px 0 #120f0c, 0 10px 24px -14px rgba(0, 0, 0, .7);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1713; --bg-dot: #26201a; --card: #26211c; --ink: #f6ece0;
    --muted: #b8a895; --line: #3a3128; --chip: #332a21;
    --shadow: 0 2px 0 #120f0c, 0 10px 24px -14px rgba(0, 0, 0, .7);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg) radial-gradient(var(--bg-dot) 1.5px, transparent 1.6px) 0 0 / 22px 22px;
    color: var(--ink);
    font-family: "Gowun Dodum", system-ui, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  header { padding: 48px 0 20px; text-align: center; }
  .badge {
    display: inline-block; font-family: Jua, sans-serif; font-size: 15px;
    background: var(--accent); color: #fff; padding: 4px 14px; border-radius: 999px;
    transform: rotate(-2deg);
  }
  h1 { font-family: Jua, sans-serif; font-weight: 400; font-size: clamp(34px, 7vw, 56px); margin: 12px 0 6px; letter-spacing: -0.5px; }
  h1 .hi { color: var(--accent); }
  .lead { color: var(--muted); font-size: 17px; margin: 0; }

  nav { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 26px 0 8px; }
  nav button {
    font: inherit; font-family: Jua, sans-serif; font-size: 16px; cursor: pointer;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
    padding: 7px 16px; border-radius: 999px;
  }
  nav button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  nav button:focus-visible, .card a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  nav .n { opacity: .6; margin-left: 4px; font-size: 13px; }

  section { margin: 28px 0 8px; }
  section h2 { font-family: Jua, sans-serif; font-weight: 400; font-size: 24px; margin: 0 0 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }

  .card {
    background: var(--card); border: 2px solid var(--line); border-radius: 20px;
    box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
    transition: transform .15s ease;
  }
  .card:hover { transform: translateY(-3px); }
  .art {
    --c: #999;
    height: 120px; display: grid; place-items: center; font-size: 58px;
    background:
      radial-gradient(circle at 20% 25%, rgba(255,255,255,.35) 0 18px, transparent 19px),
      radial-gradient(circle at 85% 80%, rgba(255,255,255,.22) 0 26px, transparent 27px),
      linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 65%, #000));
    text-shadow: 0 4px 10px rgba(0,0,0,.25);
  }
  .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .top { display: flex; align-items: center; gap: 8px; }
  .card h3 { font-family: Jua, sans-serif; font-weight: 400; font-size: 21px; margin: 0; flex: 1; }
  .chip { font-size: 12px; background: var(--chip); color: var(--muted); padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
  .card p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
  .card a {
    align-self: flex-start; margin-top: 4px; text-decoration: none;
    font-family: Jua, sans-serif; font-size: 16px; color: #fff; background: var(--ink);
    padding: 8px 18px; border-radius: 12px;
  }
  :root[data-theme="dark"] .card a { background: var(--accent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card a { background: var(--accent); } }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 0 48px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">팀 빈이네</span>
    <h1><span class="hi">빈이네</span> 게임 놀이터</h1>
    <p class="lead">빈이네가 생각하고 만든 게임과 배움 프로그램이에요. 하고 싶은 걸 골라 보세요!</p>
  </header>

  <nav id="filters" aria-label="종류 고르기"></nav>
  <main id="list"><p class="empty">작품을 불러오는 중이에요…</p></main>

  <footer>
    빈이네가 기획하고 AI와 함께 만들었어요 · 기록은 각자의 브라우저에 저장돼요
  </footer>
</div>

<script>
const GROUPS = [
  { id: 'game',  label: '게임',       icon: '🎮' },
  { id: 'learn', label: '배움 프로그램', icon: '📚' },
  { id: 'etc',   label: '기타 작품',   icon: '🧰' }
];
let works = [];
let current = 'all';
try { current = sessionStorage.getItem('binine-filter') || 'all'; } catch (e) {}

fetch('games.json')
  .then(r => r.json())
  .then(data => { works = data.works; render(); })
  .catch(() => {
    document.getElementById('list').innerHTML = '<p class="empty">작품 목록을 불러오지 못했어요. 새로고침해 보세요.</p>';
  });

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === 'style') e.style.cssText = attrs[k]; else e.setAttribute(k, attrs[k]);
  }
  for (const c of kids) e.append(c);
  return e;
}

function card(w) {
  const href = w.url || `games/${w.slug}/`;
  const link = el('a', { href }, w.url ? '열어 보기 ↗' : '하러 가기 ▶');
  if (w.url) { link.target = '_blank'; link.rel = 'noopener'; }
  return el('article', { class: 'card' },
    el('div', { class: 'art', style: `--c:${w.color}`, 'aria-hidden': 'true' }, w.emoji),
    el('div', { class: 'body' },
      el('div', { class: 'top' }, el('h3', {}, w.title), el('span', { class: 'chip' }, w.genre)),
      el('p', {}, w.summary),
      link
    )
  );
}

function render() {
  const nav = document.getElementById('filters');
  nav.textContent = '';
  const opts = [{ id: 'all', label: '전체', icon: '✨' }, ...GROUPS];
  for (const g of opts) {
    const n = g.id === 'all' ? works.length : works.filter(w => w.category === g.id).length;
    if (!n) continue;
    const b = el('button', { type: 'button', 'aria-pressed': String(current === g.id) },
      `${g.icon} ${g.label}`, el('span', { class: 'n' }, n));
    b.onclick = () => {
      current = g.id;
      try { sessionStorage.setItem('binine-filter', current); } catch (e) {}
      render();
    };
    nav.append(b);
  }

  const list = document.getElementById('list');
  list.textContent = '';
  for (const g of GROUPS) {
    if (current !== 'all' && current !== g.id) continue;
    const items = works.filter(w => w.category === g.id);
    if (!items.length) continue;
    list.append(el('section', {},
      el('h2', {}, `${g.icon} ${g.label}`),
      el('div', { class: 'grid' }, ...items.map(card))
    ));
  }
}
</script>
</body>
</html>
